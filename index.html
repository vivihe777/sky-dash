function genMtn(seed,n){return Array.from({length:n+1},(_,i)=>{const x=i/n;return Math.sin(x*4.1+seed)*.28+Math.sin(x*7.3+seed*1.7)*.15+Math.sin(x*2.2+seed*.5)*.38+Math.sin(x*11+seed*2.3)*.07;});}

//  DB LAYER — localStorage (Supabase-ready interface)
// ═══════════════════════════════════════════════════════
const DB_KEY='skydash_v6';
function dbLoad(){
  try{return JSON.parse(localStorage.getItem(DB_KEY))||{};}catch{return {};}
}
function dbSave(d){try{localStorage.setItem(DB_KEY,JSON.stringify(d));}catch{}}
function getPlayer(){
  let d=dbLoad();
  if(!d.uuid){
    d.uuid='p_'+Math.random().toString(36).slice(2,10)+Date.now().toString(36);
    d.name='玩家'+d.uuid.slice(-4);
    d.coins=0;d.bestScore=0;d.bestLv=1;d.totalGames=0;
    d.inventory={skins:[],effects:[],items:{}};
    d.equip={skin:0,effect:0};
    dbSave(d);
  }
  return d;
}
function savePlayer(d){dbSave(d);}
function addCoins(n){const d=getPlayer();d.coins=Math.max(0,(d.coins||0)+n);savePlayer(d);return d.coins;}
function spendCoins(n){const d=getPlayer();if((d.coins||0)<n)return false;d.coins-=n;savePlayer(d);return true;}
function unlockItem(type,id){
  const d=getPlayer();
  if(type==='skin'){if(!d.inventory.skins.includes(id))d.inventory.skins.push(id);}
  else if(type==='effect'){if(!d.inventory.effects.includes(id))d.inventory.effects.push(id);}
  else if(type==='item'){d.inventory.items[id]=(d.inventory.items[id]||0)+1;}
  savePlayer(d);
}
function hasItem(type,id){
  const d=getPlayer();
  if(type==='skin')return id<5||d.inventory.skins.includes(id);
  if(type==='effect')return id===0||d.inventory.effects.includes(id);
  if(type==='item')return (d.inventory.items[id]||0)>0;
  return false;
}
function useItem(id){const d=getPlayer();if((d.inventory.items[id]||0)>0){d.inventory.items[id]--;savePlayer(d);return true;}return false;}
function updateBest(score,lv){const d=getPlayer();let changed=false;if(score>d.bestScore){d.bestScore=score;changed=true;}if(lv>d.bestLv)d.bestLv=lv;d.totalGames=(d.totalGames||0)+1;savePlayer(d);return changed;}

// ═══════════════════════════════════════════════════════
//  GAME STATE
// ═══════════════════════════════════════════════════════
let PL=getPlayer(); // player data
let G={
  scene:'menu',      // menu|skinSelect|growth|ready|playing|gameOver|leaderboard
  skin:PL.equip.skin||0,
  effect:PL.equip.effect||0,
  score:0,coins:0,curLv:1,
  flash:0,flashC:'#fff',shake:0,shakeM:0,
  // shield: hits remaining (0=none, 1/2/3)
  shieldHits:0,
  // shrink
  shrinkActive:false,shrinkTimer:0,
  // gap expander
  gapActive:false,gapTimer:0,
  // coin magnet
  magnetActive:false,magnetTimer:0,
  // pre-game equipped consumables (set by loadEquippedItems)
  equippedShieldHits:0,
  equippedShrinkDur:0,
  equippedGapDur:0,
  equippedMagnetDur:0,
  speedMult:1.0,
  isNewRecord:false,
};
let banner={show:0,lv:0,timer:0,alpha:0};
let growthTab=0; // 0=skills 1=effects 2=skins
let shopTab=0;   // alias kept for compatibility
let skPrev=0,skBob=0,goAnim=0,uiT=0;

function checkLvUp(s){
  const lv=getLv(s);
  if(lv>G.curLv){G.curLv=lv;banner={show:1,lv,timer:2.8,alpha:0};}
}

let bird,pipes,coinList,parts,clouds,bgSt;
let windF=0,windT=0,windTmr=0,pipeT=0,readyT=0,mtnOff=0;
let trailParticles=[];

function initWorld(){
  clouds=Array.from({length:9},mkCloud);
  bgSt=Array.from({length:80},()=>({x:R(0,W),y:R(0,H*.68),r:R(.3,2.1),tw:R(0,6.28),s:R(.4,1.8)}));
  parts=[];trailParticles=[];mtnOff=0;
}
function mkCloud(){return{x:R(-80,W+80),y:R(28,H*.5),sc:R(.5,1.3),spd:R(14,48),al:R(.28,.75)};}
function resetBird(){
  bird={x:100,y:H/2-38,vy:0,ang:0,wa:0,wd:1,alive:true,blink:0,blinkT:3,trail:[],invincible:0};
}
function startGame(){
  PL=getPlayer();
  G.score=0;G.coins=0;G.curLv=1;
  G.shieldHits=G.equippedShieldHits||0;
  // shrink / gap / magnet: loaded from equipped items
  G.shrinkActive=false;G.shrinkTimer=0;
  G.gapActive=false;G.gapTimer=0;
  G.magnetActive=false;G.magnetTimer=0;
  G.speedMult=1.0;
  pipes=[];coinList=[];parts=[];trailParticles=[];
  pipeT=0;windF=0;windT=0;windTmr=0;
  WX.type=0;WX.timer=0;WX.changeCooldown=0;WX.rain=[];WX.lightningBolt=null;
  banner={show:0,lv:1,timer:0,alpha:0};
  resetBird();readyT=0;G.scene='ready';
}

// ═══════════════════════════════════════════════════════
//  GAME LOOP
// ═══════════════════════════════════════════════════════
let lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-lastT)/1000,.05);lastT=now;
  uiT+=dt;skBob+=dt;
  tickClouds(dt);
  if(G.flash>0)G.flash-=dt;
  if(G.shake>0)G.shake-=dt;
  if(G.scene==='ready'){readyT+=dt;bird.wa=Math.sin(readyT*4.8)*.3;bird.ang=Math.sin(readyT*2.1)*.09;bird.y=H/2-38+Math.sin(readyT*2.1)*9;}
  else if(G.scene==='playing')tickPlay(dt);
  else if(G.scene==='gameOver'){goAnim+=dt;tickParts(dt);}
  if(banner.show&&banner.timer>0){
    banner.timer-=dt;
    banner.alpha=banner.timer>2?Math.min(1,(2.8-banner.timer)*4):Math.min(1,banner.timer*3);
    if(banner.timer<=0)banner.show=0;
  }
  drawFrame(now/1000);
}

function tickPlay(dt){
  const sm=G.speedMult; // slowdown multiplier
  const d=D(G.score);
  mtnOff+=d.spd*.012*dt*sm;
  // active skill timers
  if(G.shrinkActive){G.shrinkTimer-=dt;if(G.shrinkTimer<=0)G.shrinkActive=false;}
  if(G.gapActive){G.gapTimer-=dt;if(G.gapTimer<=0)G.gapActive=false;}
  if(G.magnetActive){G.magnetTimer-=dt;if(G.magnetTimer<=0)G.magnetActive=false;}
  if(d.wind){windTmr-=dt;if(windTmr<=0){windT=R(-100,100);windTmr=R(1.8,4.5);}windF+=(windT-windF)*dt*1.25*sm;}
  else{windF*=(1-dt*3);}
  if(bird.alive){
    bird.vy+=1900*dt*sm;bird.vy=Math.min(bird.vy,720);
    if(d.wind)bird.vy+=windF*dt*.42;
    bird.y+=bird.vy*dt*sm;bird.ang=clamp(bird.vy/700*1.3,-.48,1.45);
    bird.wa+=bird.wd*7*dt;if(Math.abs(bird.wa)>.5)bird.wd*=-1;
    bird.blinkT-=dt;if(bird.blinkT<0){bird.blink=bird.blink?.04:.13;bird.blinkT=bird.blink?.13:R(2,5);}
    if(bird.invincible>0)bird.invincible-=dt;
    bird.trail.unshift({x:bird.x,y:bird.y,l:1});
    if(bird.trail.length>14)bird.trail.pop();
    bird.trail.forEach(tr=>tr.l-=dt*4.5);
    // spawn trail particles
    if(G.effect>0&&Math.random()<.65)spawnTrailParticle(bird.x,bird.y,G.effect);
    if(bird.y+BR>H-GND||bird.y-BR<0){
      if(G.shieldHits>0){
        G.shieldHits--;bird.invincible=0.55;
        G.flash=.18;G.flashC='#42A5F5';bird.vy=-260;
        burst(bird.x,bird.y,'#42A5F5',10,120);
      }else killBird();
    }
  }else{bird.vy+=1900*dt;bird.y+=bird.vy*dt;}
  pipeT-=dt;if(pipeT<=0){spawnPipe();pipeT=d.ivl/1000/sm;}
  pipes.forEach(p=>{
    p.x-=d.spd*dt*sm;
    if(p.mvA){p.ph+=p.mvS*dt*sm;p.gapY+=Math.sin(p.ph)*p.mvS*dt*20;p.gapY=clamp(p.gapY,p.gap/2+32,H-GND-p.gap/2-32);}
    if(p.gate){p.gatePhase+=dt*1.4*sm;p.gapMod=Math.sin(p.gatePhase)*p.gateAmp*-1;}
    if(!p.ok&&p.x<bird.x-BR){p.ok=true;G.score++;checkLvUp(G.score);burst(bird.x+22,bird.y,'#FFD740',6,72);}
    if(bird.alive&&bird.invincible<=0&&pipeHit(bird,p)){
      if(G.shieldHits>0){
        G.shieldHits--;bird.invincible=0.55;
        G.flash=.18;G.flashC='#42A5F5';bird.vy=-180;G.shake=.2;G.shakeM=6;
        burst(bird.x,bird.y,'#42A5F5',10,120);
      }else{G.shake=.38;G.shakeM=13;G.flash=.22;G.flashC='#ff3030';killBird();}
    }
  });
  pipes=pipes.filter(p=>p.x>-PW*2);
  coinList.forEach(c=>{
    if(!c.done){c.x-=d.spd*dt*sm;c.bob+=dt*3;
      // coin magnet: attract toward bird when active
      if(G.magnetActive&&bird.alive){
        const dx=bird.x-c.x,dy=bird.y-(c.y+Math.sin(c.bob)*5);
        const dist=Math.sqrt(dx*dx+dy*dy);
        if(dist<160){c.x+=dx/dist*220*dt;c.y+=dy/dist*220*dt;}
      }
      if(bird.alive&&d2(bird.x,bird.y,c.x,c.y+Math.sin(c.bob)*5)<(BR+c.r)**2){
        c.done=true;G.coins++;addCoins(1);
        burst(c.x,c.y,'#FFD740',8,100);G.flash=.06;G.flashC='#FFD740';}
    }
  });
  coinList=coinList.filter(c=>c.x>-60&&!c.done);
  tickParts(dt);
  tickTrailParticles(dt);
  HARNESS.run('weatherSystem',()=>tickWeather(dt));
  if(!bird.alive&&bird.y>H+90){
    const isNew=updateBest(G.score,G.curLv);
    G.isNewRecord=isNew;
    goAnim=0;G.scene='gameOver';
  }
}

function spawnPipe(){

  pipes.push({x:W+PW/2+14,gapY,gap:d.gap,mvA:mv,ph:R(0,6.28),mvS:R(.7,1.4),ok:false,
              gate,gatePhase:R(0,6.28),gateAmp,gapMod:0});

function pipeHit(b,p){
  const shrinkFactor=HARNESS.birdShrink&&G.shrinkActive?0.7:1.0;
  const br=BR*.76*shrinkFactor,pw=PW/2+PCAP;
  if(b.x+br<p.x-pw||b.x-br>p.x+pw)return false;
  const gapBonus=HARNESS.gapExpander&&G.gapActive?40:0;
  const effGap=(p.gap+(p.gapMod||0)+gapBonus)/2;
  return b.y-br<p.gapY-effGap||b.y+br>p.gapY+effGap;
}

// ── Trail particle system ────────────────────────────
function spawnTrailParticle(x,y,eff){
  const p={x:x+R(-4,4),y:y+R(-4,4),life:1,maxLife:1,vx:R(20,60),vy:R(-12,12),r:R(2,5),eff};
  if(eff===1){p.color='#FF6D00';p.colorEnd='#FF1744';p.r=R(2.5,5.5);p.life=R(.25,.55);p.maxLife=p.life;}
  else if(eff===2){const h=Math.floor(R(0,360));p.color=`hsl(${h},100%,70%)`;p.life=R(.3,.6);p.maxLife=p.life;p.r=R(1.5,4);}
  else if(eff===3){p.color=Math.random()<.5?'#E0E0FF':'#40C4FF';p.life=R(.1,.25);p.maxLife=p.life;p.r=R(1,3);p.vx*=-1;}
  else if(eff===4){p.color='#FFF9C4';p.life=R(.4,.9);p.maxLife=p.life;p.r=R(1,3);p.vy+=R(-20,20);}
  trailParticles.push(p);
}
function tickTrailParticles(dt){
  trailParticles.forEach(p=>{p.x-=p.vx*dt;p.y+=p.vy*dt;if(p.eff===1)p.vy+=120*dt;p.life-=dt;});
  trailParticles=trailParticles.filter(p=>p.life>0);
}
function drawTrailParticles(){
  trailParticles.forEach(p=>{
    const al=p.life/p.maxLife;
    ctx.save();ctx.globalAlpha=al*.8;
    if(p.eff===3){ctx.shadowColor=p.color;ctx.shadowBlur=6;}
    ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,p.r*al+.5,0,6.28);ctx.fill();
    ctx.restore();
  });
}

function tickParts(dt){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=185*dt;p.l-=p.dc*dt;});parts=parts.filter(p=>p.l>0);}
function tickClouds(dt){const sp=G.scene==='playing'?D(G.score).spd:60;clouds.forEach(c=>{c.x-=c.spd*dt*(sp/150)*G.speedMult;if(c.x<-150){c.x=W+80;c.y=R(28,H*.5);}});}

// ── Weather system ────────────────────────────────────
// Types: 0=none 1=rain 2=lightning 3=tornado 4=thunderstorm
const WX={
  type:0,timer:0,changeCooldown:0,
  rain:[],lightningFlash:0,lightningBolt:null,
  tornado:{x:W*.7,y:H*.4,wobble:0,phase:0},
  overlay:0
};
const WX_TYPES=['none','rain','lightning','tornado','thunderstorm'];
function wxChoose(){
  const t=Math.floor(R(1,5));// 1-4
  WX.type=t;WX.timer=R(6,14);
  if(t===1||t===4){// rain / thunderstorm — spawn drops
    WX.rain=Array.from({length:t===4?80:45},()=>({x:R(0,W),y:R(-H,0),vy:R(420,620),vx:R(-30,30),l:R(8,18)}));
  }
  if(t===2||t===4)WX.lightningFlash=0;
  if(t===3){WX.tornado.x=W+80;WX.tornado.y=R(H*.25,H*.6);}
}
function tickWeather(dt){
  if(!HARNESS.weatherSystem)return;
  if(G.score<20){WX.type=0;return;}
  WX.changeCooldown-=dt;
  if(WX.type===0&&WX.changeCooldown<=0){wxChoose();WX.changeCooldown=R(8,18);}
  if(WX.type===0)return;
  WX.timer-=dt;
  if(WX.timer<=0){WX.type=0;WX.changeCooldown=R(6,12);return;}
  // rain / thunderstorm drops
  if(WX.type===1||WX.type===4){
    WX.rain.forEach(d=>{d.x+=d.vx*dt;d.y+=d.vy*dt;if(d.y>H){d.y=-R(10,60);d.x=R(0,W);}});
  }
  // lightning bolt timer
  if(WX.type===2||WX.type===4){
    WX.lightningFlash-=dt;
    if(WX.lightningFlash<=0){
      WX.lightningFlash=R(1.5,4);
      WX.lightningBolt={x:R(30,W-30),segs:Array.from({length:8},(_,i)=>R(-22,22))};
      G.flash=.12;G.flashC='rgba(220,240,255,.9)';
    }else if(WX.lightningFlash<0.08)WX.lightningBolt=null;
  }
  // tornado drift
  if(WX.type===3){
    WX.tornado.x-=D(G.score).spd*.18*dt*G.speedMult;
    WX.tornado.phase+=dt*2.4;
    WX.tornado.wobble=Math.sin(WX.tornado.phase)*18;
    if(WX.tornado.x<-80){WX.type=0;WX.changeCooldown=R(6,12);}
    // tornado danger zone — warn only (no kill, just shockwave push)
    if(bird.alive){
      const dx=bird.x-(WX.tornado.x+WX.tornado.wobble),dy=bird.y-WX.tornado.y;
      if(dx*dx+dy*dy<52*52){bird.vy-=280*dt;bird.vx=(bird.vx||0)+R(-60,60)*dt*8;}
    }
  }
}
function drawWeather(){
  if(!HARNESS.weatherSystem||WX.type===0)return;
  ctx.save();
  // rain
  if(WX.type===1||WX.type===4){
    ctx.strokeStyle='rgba(174,214,241,.55)';ctx.lineWidth=1.2;
    WX.rain.forEach(d=>{ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x+d.vx*.04,d.y+d.l);ctx.stroke();});
  }
  // thunderstorm extra dark overlay
  if(WX.type===4){ctx.fillStyle='rgba(10,20,40,.22)';ctx.fillRect(0,0,W,H);}
  // lightning bolt
  if((WX.type===2||WX.type===4)&&WX.lightningBolt){
    const {x,segs}=WX.lightningBolt;const segH=H/segs.length;
    ctx.save();ctx.shadowColor='#E0E0FF';ctx.shadowBlur=18;
    ctx.strokeStyle='rgba(220,240,255,.92)';ctx.lineWidth=2.2;
    ctx.beginPath();let cx2=x,cy2=0;ctx.moveTo(cx2,cy2);
    segs.forEach((ox,i)=>{cx2+=ox;cy2+=(i+1)*segH*.7;ctx.lineTo(cx2,cy2);});
    ctx.stroke();ctx.restore();
  }
  // tornado funnel — realistic gray-brown funnel cloud
  if(WX.type===3){
    const {x:tx2,y:ty,wobble,phase}=WX.tornado;const fx=tx2+wobble;
    ctx.save();
    // dark storm cloud at top
    ctx.globalAlpha=.82;
    const cg=ctx.createRadialGradient(fx,ty-80,10,fx,ty-80,75);
    cg.addColorStop(0,'rgba(55,50,48,.95)');cg.addColorStop(.7,'rgba(40,38,36,.7)');cg.addColorStop(1,'rgba(30,28,26,0)');
    ctx.fillStyle=cg;ctx.beginPath();ctx.ellipse(fx,ty-72,80,38,0,0,6.28);ctx.fill();
    // funnel body — tapers from wide (top) to narrow (bottom)
    const segments=12;
    for(let i=0;i<segments;i++){
      const frac=i/segments;
      const w=Math.max(4,52*(1-frac*frac));// wide top, narrow bottom
      const fy=ty-55+i*13;
      const spin=Math.sin(phase*1.8+i*.6)*w*.45;
      const alpha=0.55+frac*.2;
      // alternating light/dark bands for spiral effect
      const band=(Math.sin(phase*3+i*1.1)*.5+.5);
      const r=Math.floor(65+band*25),g=Math.floor(58+band*20),b=Math.floor(52+band*18);
      ctx.fillStyle=`rgba(${r},${g},${b},${alpha})`;
      ctx.beginPath();ctx.ellipse(fx+spin,fy,w/2+1,5,0,0,6.28);ctx.fill();
      // inner darker core
      ctx.fillStyle=`rgba(30,26,24,${alpha*.6})`;
      ctx.beginPath();ctx.ellipse(fx+spin,fy,w/4,3,0,0,6.28);ctx.fill();
    }
    // dust/debris swirl at base
    for(let i=0;i<8;i++){
      const a=phase*2+i*.785,r=R(12,28);
      const dx=Math.cos(a)*r,dy=Math.sin(a)*r*.35;
      const bfrac=i/8;
      ctx.fillStyle=`rgba(80,65,50,${.3+bfrac*.2})`;
      ctx.beginPath();ctx.arc(fx+dx,ty+85+dy,R(2,5),0,6.28);ctx.fill();
    }
    ctx.restore();
    // warning label
    ctx.save();ctx.globalAlpha=.8;ctx.font='bold 11px system-ui';
    ctx.fillStyle='#e8d0a0';ctx.textAlign='center';ctx.shadowColor='rgba(0,0,0,.8)';ctx.shadowBlur=4;
    ctx.fillText('⚠ 龙卷风',fx,ty-120);ctx.restore();
  }
  ctx.restore();
}

function dPipe(p){
  let th;
  HARNESS.run('pipeThemes',()=>{th=getPipeTheme(G.curLv);});
  if(!th)th=PIPE_THEMES[0]; // fallback green
  const effGap=(p.gap+(p.gapMod||0))/2;
  const topH=p.gapY-effGap,botY=p.gapY+effGap,botH=H-GND-botY;
  function body(x,y,w,h){
    if(h<=0)return;
    const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
    g.addColorStop(0,th.b0);g.addColorStop(.28,th.b1);g.addColorStop(.55,th.b2);g.addColorStop(.82,th.b3);g.addColorStop(1,th.b4);

    ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(x+w/2-8,y,8,h);
  }
  function cap(x,y,w,h){
    if(h<=0)return;
    const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
    g.addColorStop(0,th.c0);g.addColorStop(.35,th.c1);g.addColorStop(.65,th.c2);g.addColorStop(1,th.c0);
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-w/2,y,w,h,3);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.roundRect(x-w/2+4,y+2,w-8,h*.45,2);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x-w/2,y,w,h,3);ctx.stroke();
  }
  // glow aura for themed pipes
  if(th.glow){ctx.save();ctx.shadowColor=th.glow;ctx.shadowBlur=18;}
  body(p.x,0,PW,topH);cap(p.x,topH-26,PW+PCAP*2,26);
  const bh=botH-26>0?botH-26:0;body(p.x,botY+26,PW,bh);cap(p.x,botY,PW+PCAP*2,26);
  if(th.glow)ctx.restore();
  // gate indicator: red edge lines when closing
  if(p.gate&&p.gapMod<-8){

    ctx.strokeStyle='#ff3030';ctx.lineWidth=2;

    ctx.restore();
  }

  if(G.shrinkActive){ctx.fillStyle='rgba(200,100,255,.04)';ctx.fillRect(p.x-PW/2-PCAP,0,PW+PCAP*2,H);}
}

function btn(cx,cy,w,h,label,bg,fg){
  const x=cx-w/2,y=cy-h/2;ctx.save();
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=14;ctx.shadowOffsetY=5;
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x,y,w,h,h/2);ctx.fill();

  ctx.fillStyle='rgba(255,255,255,.14)';ctx.beginPath();ctx.roundRect(x+2,y+2,w-4,h*.42,h*.42);ctx.fill();
  ctx.fillStyle=fg;ctx.font='800 16px system-ui';ctx.textAlign='center';ctx.fillText(label,cx,cy+6);
  ctx.restore();
}
function gCard(x,y,w,h,r,fill,stroke){
  ctx.fillStyle=fill||'rgba(255,255,255,.07)';ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.stroke();}
}
function tx(s,x,y,sz,c,w){ctx.font=`${w||'400'} ${sz}px system-ui`;ctx.textAlign='center';ctx.fillStyle=c;ctx.fillText(s,x,y);}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();}
function arrowBtn(x,y,d){ctx.save();ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();if(d==='L'){ctx.moveTo(x+14,y-18);ctx.lineTo(x-4,y);ctx.lineTo(x+14,y+18);}else{ctx.moveTo(x-14,y-18);ctx.lineTo(x+4,y);ctx.lineTo(x-14,y+18);}ctx.closePath();ctx.fill();ctx.restore();}

// ═══════════════════════════════════════════════════════
//  INPUT
// ═══════════════════════════════════════════════════════
function tap(ex,ey){
  const rect=cv.getBoundingClientRect(),s=parseFloat(cv.style.width)/W;
  const cx=(ex-rect.left)/s,cy=(ey-rect.top)/s;
  if(G.scene==='menu'){
    if(H$(cx,cy,W/2,388,220,52)){loadEquippedItems();G.skin=skPrev;startGame();}
    else if(H$(cx,cy,W/2-62,452,110,44)){skPrev=G.skin;G.scene='skinSelect';}
    else if(H$(cx,cy,W/2+62,452,110,44)){growthTab=0;G.scene='growth';}
    else if(H$(cx,cy,W/2,506,220,40)){G.scene='leaderboard';}
    else if(H$(cx,cy,W/2,552,220,34)){
      const code=prompt('你想说什么？','');
      if(code&&code.trim()==='天王老子来了'){
        addCoins(888);G.flash=.16;G.flashC='#E91E63';
      }else if(code!==null){G.flash=.18;G.flashC='#ff3030';}
    }
  }
  else if(G.scene==='skinSelect'){
    if(H$(cx,cy,W/2,H-66,220,48)){
      if(hasItem('skin',skPrev)){G.skin=skPrev;PL.equip.skin=skPrev;savePlayer(PL);G.scene='menu';}
      else{const sk=SK[skPrev];if(spendCoins(sk.price)){unlockItem('skin',skPrev);PL=getPlayer();G.skin=skPrev;PL.equip.skin=skPrev;savePlayer(PL);G.flash=.15;G.flashC=sk.accent;G.scene='menu';}
        else{G.flash=.2;G.flashC='#ff3030';}}
    }
    else if(cy>H-26&&cy<H){G.scene='menu';}
    else if(cx<W/3&&skPrev>0)skPrev--;
    else if(cx>W*2/3&&skPrev<SK.length-1)skPrev++;
  }
  else if(G.scene==='growth'){
    // tabs
    if(H$(cx,cy,W/2-115,100,88,28))growthTab=0;
    else if(H$(cx,cy,W/2,100,88,28))growthTab=1;
    else if(H$(cx,cy,W/2+115,100,88,28))growthTab=2;
    // skills tab
    else if(growthTab===0){
      GROWTH_SKILLS.forEach((skill,si)=>{
        const sy=124+si*116;
        skill.tiers.forEach((tier,ti)=>{
          const tx3=48+ti*110,ty3=sy+48+42;// buy button area y
          const itemId=`${skill.id}_t${tier.t}`;
          if(H$(cx,cy,tx3,ty3,60,10)){
            if(spendCoins(tier.price)){unlockItem('item',itemId);PL=getPlayer();G.flash=.12;G.flashC=skill.color;}
            else{G.flash=.2;G.flashC='#ff3030';}
          }
        });
      });
    }
    // effects tab
    else if(growthTab===1){
      SHOP_EFFECTS.forEach((eff,i)=>{
        const ey=124+i*76;
        if(hasItem('effect',eff.id)){
          if(H$(cx,cy,W-66,ey+50,88,20)){G.effect=eff.id;PL.equip.effect=eff.id;savePlayer(PL);}
        }else if(eff.price>0&&H$(cx,cy,W-66,ey+50,88,20)){
          if(spendCoins(eff.price)){unlockItem('effect',eff.id);PL=getPlayer();G.flash=.12;G.flashC=eff.color;}
          else{G.flash=.2;G.flashC='#ff3030';}
        }
      });
    }
    // skins tab — navigate to skinSelect
    else if(growthTab===2){
      SK.forEach((sk,i)=>{
        const sy=124+Math.floor(i/2)*90,sx=i%2===0?W/4:W*3/4;
        if(H$(cx,cy,sx,sy+40,80,80)){skPrev=i;G.scene='skinSelect';}
      });
    }
    if(H$(cx,cy,W/2,H-46,200,40))G.scene='menu';
  }
  else if(G.scene==='ready'){bird.vy=-525;burst(bird.x-8,bird.y+8,SK[G.skin].glow,4,42);G.scene='playing';}
  else if(G.scene==='playing'){
    if(bird.alive){
      let skillTapped=false;
      // shrink button (bottom-right, r=22)
      if(G.equippedShrinkDur>0&&!G.shrinkActive&&H$(cx,cy,W-46,H-GND-58,44,44)){
        G.shrinkActive=true;G.shrinkTimer=G.equippedShrinkDur;G.equippedShrinkDur=0;
        G.flash=.1;G.flashC='#CE93D8';skillTapped=true;
      }
      // gap button
      if(G.equippedGapDur>0&&!G.gapActive&&H$(cx,cy,W-46,H-GND-112,40,40)){
        G.gapActive=true;G.gapTimer=G.equippedGapDur;G.equippedGapDur=0;
        G.flash=.1;G.flashC='#80CBC4';skillTapped=true;
      }
      // magnet button
      if(G.equippedMagnetDur>0&&!G.magnetActive&&H$(cx,cy,W-46,H-GND-160,40,40)){
        G.magnetActive=true;G.magnetTimer=G.equippedMagnetDur;G.equippedMagnetDur=0;
        G.flash=.1;G.flashC='#FFB74D';skillTapped=true;
      }
      if(!skillTapped){bird.vy=-525;bird.wa=-.42;burst(bird.x-8,bird.y+8,SK[G.skin].glow,4,42);}
    }
  }
  else if(G.scene==='gameOver'){
    if(H$(cx,cy,W/2,418,230,54))startGame();
    else if(H$(cx,cy,W/2-62,482,106,42)){skPrev=G.skin;G.scene='skinSelect';}
    else if(H$(cx,cy,W/2+62,482,106,42)){growthTab=0;G.scene='growth';}
    else if(H$(cx,cy,W/2,534,230,38))G.scene='menu';
  }
  else if(G.scene==='leaderboard'){
    if(H$(cx,cy,W/2,478,200,36)){// rename
      const nn=prompt('输入你的昵称（最多8字）:','');
      if(nn&&nn.trim()){PL.name=nn.trim().slice(0,8);savePlayer(PL);}
    }
    else if(H$(cx,cy,W/2,528,200,40))G.scene='menu';
  }
}
function H$(cx,cy,bx,by,w,h){return cx>bx-w/2&&cx<bx+w/2&&cy>by-h/2&&cy<by+h/2;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY);},{passive:false});
let tSX=0;
cv.addEventListener('touchstart',e=>tSX=e.touches[0].clientX,{passive:true});
cv.addEventListener('touchend',e=>{
  if(G.scene==='skinSelect'){const dx=(e.changedTouches[0].clientX-tSX)/(parseFloat(cv.style.width)/W);if(dx<-45&&skPrev<SK.length-1)skPrev++;else if(dx>45&&skPrev>0)skPrev--;}
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();
    if(G.scene==='ready'){bird.vy=-525;G.scene='playing';}
    else if(G.scene==='playing'&&bird.alive){bird.vy=-525;bird.wa=-.42;}
  }
});

// ═══════════════════════════════════════════════════════
//  UTILS
// ═══════════════════════════════════════════════════════
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function d2(x1,y1,x2,y2){return(x1-x2)**2+(y1-y2)**2;}
function lerpC(c1,c2,t){
  const p=s=>parseInt(s,16);
  const r1=p(c1.slice(1,3)),g1=p(c1.slice(3,5)),b1=p(c1.slice(5,7));
  const r2=p(c2.slice(1,3)),g2=p(c2.slice(3,5)),b2=p(c2.slice(5,7));
  return`rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
}

// ── Pre-game: equip items from inventory ─────────────
function loadEquippedItems(){
  PL=getPlayer();
  // Shield: find highest owned tier
  const shieldTier=PL.inventory.items['shield_t3']>0?3:PL.inventory.items['shield_t2']>0?2:PL.inventory.items['shield_t1']>0?1:0;
  G.equippedShieldHits=shieldTier;
  // Shrink: find highest owned tier
  const shrinkTier=PL.inventory.items['shrink_t3']>0?3:PL.inventory.items['shrink_t2']>0?2:PL.inventory.items['shrink_t1']>0?1:0;
  G.equippedShrinkDur=shrinkTier===3?20:shrinkTier===2?15:shrinkTier===1?10:0;
  // Gap expander: find highest owned tier
  const gapTier=PL.inventory.items['gap_t3']>0?3:PL.inventory.items['gap_t2']>0?2:PL.inventory.items['gap_t1']>0?1:0;
  G.equippedGapDur=gapTier===3?20:gapTier===2?14:gapTier===1?8:0;
  // Coin magnet: find highest owned tier
  const magTier=PL.inventory.items['magnet_t3']>0?3:PL.inventory.items['magnet_t2']>0?2:PL.inventory.items['magnet_t1']>0?1:0;
  G.equippedMagnetDur=magTier===3?30:magTier===2?20:magTier===1?12:0;
  G.skin=PL.equip.skin||0;
  G.effect=PL.equip.effect||0;
  skPrev=G.skin;
}

// ── Boot ─────────────────────────────────────────────
loadEquippedItems();
initWorld();resetBird();
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop);});
</script>
