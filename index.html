<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>Sky Dash · 天空冲刺</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#04060e;
  display:flex;align-items:center;justify-content:center}
#c{display:block;touch-action:none;cursor:pointer}
</style>
</head>
<body><canvas id="c"></canvas>
<script>
// ═══════════════════════════════════════════════
//  SKY DASH v5 · 5 Skins · Continuous Difficulty
// ═══════════════════════════════════════════════
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const W = 390, H = 660;
const DPR = Math.min(window.devicePixelRatio || 1, 3);
cv.width = W * DPR; cv.height = H * DPR; ctx.scale(DPR, DPR);
function resize() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  cv.style.width = W * s + 'px'; cv.style.height = H * s + 'px';
}
resize(); addEventListener('resize', resize);

// ── Difficulty ───────────────────────────────
const DIFF = [
  {spd:148,gap:196,ivl:2200,wind:0,mv:0},
  {spd:168,gap:182,ivl:2060,wind:0,mv:0},
  {spd:188,gap:169,ivl:1920,wind:0,mv:0},
  {spd:208,gap:157,ivl:1800,wind:0,mv:0},
  {spd:230,gap:146,ivl:1680,wind:1,mv:0},
  {spd:252,gap:135,ivl:1570,wind:0,mv:1},
  {spd:272,gap:125,ivl:1460,wind:0,mv:1},
  {spd:295,gap:116,ivl:1360,wind:1,mv:1},
  {spd:318,gap:107,ivl:1260,wind:1,mv:1},
  {spd:345,gap: 99,ivl:1160,wind:1,mv:1},
];
const getLv = s => Math.min(10, Math.floor(s / 5) + 1);
const D = s => DIFF[getLv(s) - 1];
const GND = 64, BR = 19, PW = 62, PCAP = 11;

// ── Mountain profiles ─────────────────────────
function genMtn(seed, n) {
  return Array.from({length: n + 1}, (_, i) => {
    const x = i / n;
    return Math.sin(x*4.1+seed)*.28 + Math.sin(x*7.3+seed*1.7)*.15
         + Math.sin(x*2.2+seed*.5)*.38 + Math.sin(x*11+seed*2.3)*.07;
  });
}
const MTN = [
  {pts:genMtn(1.2,80),baseY:.55,amp:90,color:'#0a1628',spd:.008},
  {pts:genMtn(2.7,80),baseY:.62,amp:70,color:'#0d1e38',spd:.015},
  {pts:genMtn(4.1,80),baseY:.68,amp:52,color:'#111f2e',spd:.025},
];

// ── 5 Skins ───────────────────────────────────
const SK = [
// ── 0 经典黄鸟 ──────────────────────────────
{name:'经典黄鸟',desc:'鸟中战斗鸟',accent:'#FFD740',glow:'rgba(255,210,0,.5)',
 draw(x,y,wa,bl,t){
  const c=ctx; c.save(); c.translate(x,y);
  c.shadowColor='rgba(255,180,0,.4)'; c.shadowBlur=20;
  // tail
  c.lineCap='round';
  [[-0.22,-4],[0,-1],[0.22,2]].forEach(([a,oy])=>{
    c.save(); c.rotate(a*.5);
    c.beginPath(); c.moveTo(16,oy);
    c.bezierCurveTo(22,oy-1,27,oy+a*10,32,oy+a*14);
    c.strokeStyle=a===0?'#E65100':'#BF360C';
    c.lineWidth=a===0?5.5:3.5; c.stroke(); c.restore();
  });
  // wing
  c.save(); c.rotate(wa*.9);
  c.beginPath(); c.moveTo(4,8);
  c.bezierCurveTo(-2,18,12,26,21,18);
  c.bezierCurveTo(27,11,20,0,10,3);
  c.bezierCurveTo(7,4,4,6,4,8); c.closePath();
  const wg=c.createLinearGradient(4,3,21,18);
  wg.addColorStop(0,'#FFAB40'); wg.addColorStop(1,'#E64A19');
  c.fillStyle=wg; c.fill(); c.restore();
  // body
  c.beginPath(); c.moveTo(-15,3);
  c.bezierCurveTo(-14,-20,4,-26,17,-14);
  c.bezierCurveTo(25,-5,24,10,15,18);
  c.bezierCurveTo(7,24,-5,22,-11,14);
  c.bezierCurveTo(-17,8,-18,6,-15,3); c.closePath();
  const bg=c.createRadialGradient(-3,-8,2,2,-3,24);
  bg.addColorStop(0,'#FFF9C4'); bg.addColorStop(.45,'#FFD600'); bg.addColorStop(.85,'#FFA000'); bg.addColorStop(1,'#E65100');
  c.fillStyle=bg; c.fill(); c.strokeStyle='rgba(0,0,0,.1)'; c.lineWidth=1; c.stroke();
  c.beginPath(); c.ellipse(0,7,7,5,0.15,0,Math.PI*2); c.fillStyle='rgba(255,255,200,.5)'; c.fill();
  // eye
  c.beginPath(); c.ellipse(-6,-5,9.5,8.5,-0.15,0,Math.PI*2); c.fillStyle='#fff'; c.fill();
  if(bl<.4){
    c.beginPath(); c.arc(-4,-5,6,0,Math.PI*2); c.fillStyle='#1a1040'; c.fill();
    c.beginPath(); c.arc(-2,-7.5,2.2,0,Math.PI*2); c.fillStyle='rgba(255,255,255,.9)'; c.fill();
    c.beginPath(); c.arc(-5,-4,1,0,Math.PI*2); c.fillStyle='rgba(255,255,255,.45)'; c.fill();
  }else{
    c.beginPath(); c.moveTo(-14,-6); c.bezierCurveTo(-9,-2,-2,-1,2,-5);
    c.strokeStyle='#1a1040'; c.lineWidth=2.5; c.stroke();
  }
  c.beginPath(); c.ellipse(-6,-5,9.5,8.5,-0.15,0,Math.PI*2);
  c.strokeStyle='rgba(0,0,0,.15)'; c.lineWidth=1; c.stroke();
  // beak
  c.beginPath(); c.moveTo(-13,-1); c.lineTo(-27,2); c.lineTo(-14,8); c.closePath();
  const bk=c.createLinearGradient(-27,2,-13,2);
  bk.addColorStop(0,'#FF6D00'); bk.addColorStop(1,'#FFA040');
  c.fillStyle=bk; c.fill();
  c.beginPath(); c.moveTo(-14,3); c.lineTo(-26,2);
  c.strokeStyle='rgba(0,0,0,.3)'; c.lineWidth=1.2; c.stroke();
  c.restore();
}},

// ── 1 赛博机甲 ──────────────────────────────
{name:'赛博机甲',desc:'钢铁之翼不惧风暴',accent:'#40C4FF',glow:'rgba(0,196,255,.5)',
 draw(x,y,wa,bl,t){
  const c=ctx; c.save(); c.translate(x,y);
  c.shadowColor='rgba(0,200,255,.55)'; c.shadowBlur=22;
  // exhaust
  c.save(); c.translate(20,2);
  const ef=c.createLinearGradient(0,0,18,0);
  ef.addColorStop(0,'rgba(0,200,255,.85)'); ef.addColorStop(.5,'rgba(100,220,255,.4)'); ef.addColorStop(1,'rgba(0,200,255,0)');
  c.fillStyle=ef;
  const ex2=Math.sin(t*9)*3;
  c.beginPath(); c.moveTo(0,-5); c.lineTo(16+ex2,0); c.lineTo(0,5); c.closePath(); c.fill();
  c.fillStyle='rgba(255,255,255,.6)';
  c.beginPath(); c.moveTo(0,-2); c.lineTo(6,0); c.lineTo(0,2); c.closePath(); c.fill();
  c.restore();
  // wing
  c.save(); c.rotate(wa*.55);
  c.beginPath(); c.moveTo(4,5); c.lineTo(20,11); c.lineTo(24,3); c.lineTo(16,-5); c.lineTo(4,-1); c.closePath();
  const wpg=c.createLinearGradient(4,5,24,3);
  wpg.addColorStop(0,'#1565C0'); wpg.addColorStop(1,'#0D47A1');
  c.fillStyle=wpg; c.fill(); c.strokeStyle='rgba(100,200,255,.35)'; c.lineWidth=1; c.stroke();
  c.beginPath(); c.moveTo(9,8); c.lineTo(17,5);
  c.strokeStyle='rgba(150,220,255,.4)'; c.lineWidth=.8; c.stroke();
  c.restore();
  // body
  c.beginPath();
  c.moveTo(-17,1); c.lineTo(-10,-17); c.lineTo(7,-21); c.lineTo(20,-11);
  c.lineTo(21,4); c.lineTo(11,17); c.lineTo(-5,17); c.lineTo(-17,9); c.closePath();
  const bbg=c.createLinearGradient(-17,-21,21,17);
  bbg.addColorStop(0,'#1E88E5'); bbg.addColorStop(.5,'#1565C0'); bbg.addColorStop(1,'#0D47A1');
  c.fillStyle=bbg; c.fill(); c.strokeStyle='rgba(100,200,255,.25)'; c.lineWidth=1.5; c.stroke();
  c.strokeStyle='rgba(80,160,255,.2)'; c.lineWidth=.8;
  c.beginPath(); c.moveTo(-2,-19); c.lineTo(-2,15); c.stroke();
  c.beginPath(); c.moveTo(-15,5); c.lineTo(19,3); c.stroke();
  // visor
  c.save(); c.shadowColor='#00E5FF'; c.shadowBlur=12;
  const vg=c.createLinearGradient(-13,-10,7,-2);
  vg.addColorStop(0,'#0288D1'); vg.addColorStop(.45,'#E0F7FF'); vg.addColorStop(1,'#0288D1');
  c.fillStyle=vg; c.beginPath(); c.roundRect(-13,-11,20,9,2.5); c.fill();
  c.strokeStyle='rgba(0,230,255,.9)'; c.lineWidth=1.2;
  c.beginPath(); c.roundRect(-13,-11,20,9,2.5); c.stroke();
  if(!bl){ c.fillStyle='rgba(255,255,255,.55)'; c.fillRect(-12,-10,18,2); }
  c.restore();
  // nose
  c.beginPath(); c.moveTo(-15,0); c.lineTo(-28,-3); c.lineTo(-29,4); c.lineTo(-14,6); c.closePath();
  const nk=c.createLinearGradient(-29,0,-14,0);
  nk.addColorStop(0,'#0D47A1'); nk.addColorStop(1,'#1565C0');
  c.fillStyle=nk; c.fill(); c.strokeStyle='rgba(100,200,255,.3)'; c.lineWidth=.8; c.stroke();
  [-1.5,1.5].forEach(d=>{c.beginPath();c.moveTo(-15,d*1.5);c.lineTo(-27,d);c.stroke();});
  // antenna
  c.save(); c.translate(-7,-21);
  c.strokeStyle='rgba(100,200,255,.7)'; c.lineWidth=1.5;
  c.beginPath(); c.moveTo(0,0); c.lineTo(-2,-11); c.stroke();
  c.shadowColor='#00E5FF'; c.shadowBlur=8;
  c.fillStyle='#00E5FF'; c.beginPath(); c.arc(-2,-12,2.5,0,Math.PI*2); c.fill();
  const ag=c.createRadialGradient(-2,-12,0,-2,-12,6);
  ag.addColorStop(0,'rgba(0,229,255,.4)'); ag.addColorStop(1,'transparent');
  c.fillStyle=ag; c.beginPath(); c.arc(-2,-12,6,0,Math.PI*2); c.fill();
  c.restore(); c.restore();
}},

// ── 2 幽灵精灵 ──────────────────────────────
{name:'幽灵精灵',desc:'虚空来客飞行无声',accent:'#69FF47',glow:'rgba(100,255,60,.5)',
 draw(x,y,wa,bl,t){
  const c=ctx; c.save(); c.translate(x,y);
  c.shadowColor='rgba(100,255,60,.6)'; c.shadowBlur=26;
  const aura=c.createRadialGradient(0,0,4,0,0,30);
  aura.addColorStop(0,'rgba(100,255,60,.18)'); aura.addColorStop(1,'transparent');
  c.fillStyle=aura; c.beginPath(); c.arc(0,0,30,0,6.28); c.fill();
  // wisps
  for(let i=4;i>=0;i--){
    const ph=t*3.2+i*1.4, al=.55-i*.08;
    c.save(); c.beginPath();
    c.moveTo(15,1+i*2-5);
    c.bezierCurveTo(20+Math.sin(ph)*5,2+i*3-7,26+Math.cos(ph+1)*5,1+i*4-7+Math.sin(ph)*5,31+Math.sin(ph*1.4)*4,(i-2)*9+Math.cos(ph)*6);
    const wc=c.createLinearGradient(15,0,31,0);
    wc.addColorStop(0,`rgba(100,255,60,${al})`); wc.addColorStop(1,'rgba(100,255,60,0)');
    c.strokeStyle=wc; c.lineWidth=3.8-i*.55; c.lineCap='round'; c.stroke(); c.restore();
  }
  // wing
  c.save(); c.rotate(wa*.75);
  c.beginPath(); c.moveTo(4,8); c.bezierCurveTo(-2,18,13,24,19,15);
  c.bezierCurveTo(24,8,17,-2,7,2); c.bezierCurveTo(5,4,4,6,4,8); c.closePath();
  const wg=c.createLinearGradient(4,8,19,15);
  wg.addColorStop(0,'rgba(100,255,60,.7)'); wg.addColorStop(1,'rgba(50,180,30,.3)');
  c.fillStyle=wg; c.fill(); c.restore();
  // body
  c.beginPath(); c.moveTo(-15,5);
  c.bezierCurveTo(-15,-17,2,-28,14,-17);
  c.bezierCurveTo(22,-8,21,9,13,19);
  c.bezierCurveTo(6,26,-5,24,-11,15);
  c.bezierCurveTo(-16,10,-17,8,-15,5); c.closePath();
  const gb=c.createRadialGradient(-1,-5,2,1,-2,26);
  gb.addColorStop(0,'rgba(210,255,180,.95)'); gb.addColorStop(.4,'rgba(100,255,60,.85)');
  gb.addColorStop(.8,'rgba(30,160,10,.7)'); gb.addColorStop(1,'rgba(10,100,0,.6)');
  c.fillStyle=gb; c.fill(); c.strokeStyle='rgba(100,255,60,.55)'; c.lineWidth=1.5; c.stroke();
  const ig=c.createRadialGradient(0,-2,0,0,-2,15);
  ig.addColorStop(0,'rgba(200,255,150,.4)'); ig.addColorStop(1,'transparent');
  c.fillStyle=ig; c.beginPath(); c.arc(0,-2,15,0,6.28); c.fill();
  // eyes
  [[-8,-8],[3,-8]].forEach(([ex,ey])=>{
    c.save();
    if(bl<.4){
      const eg=c.createRadialGradient(ex,ey,0,ex,ey,9);
      eg.addColorStop(0,'rgba(160,255,80,.35)'); eg.addColorStop(1,'transparent');
      c.fillStyle=eg; c.beginPath(); c.arc(ex,ey,9,0,6.28); c.fill();
      c.beginPath(); c.arc(ex,ey,5.5,0,6.28); c.strokeStyle='rgba(180,255,100,.95)'; c.lineWidth=2; c.stroke();
      c.beginPath(); c.arc(ex+1,ey-1.5,1.5,0,6.28); c.fillStyle='rgba(255,255,255,.75)'; c.fill();
    }else{
      c.beginPath(); c.moveTo(ex-5,ey); c.lineTo(ex+5,ey);
      c.strokeStyle='rgba(180,255,100,.8)'; c.lineWidth=2.5; c.stroke();
    }
    c.restore();
  });
  c.beginPath(); c.moveTo(-12,5); c.bezierCurveTo(-7,9,-3,7,0,9); c.bezierCurveTo(3,11,7,8,10,5);
  c.strokeStyle='rgba(100,255,60,.65)'; c.lineWidth=1.5; c.stroke();
  c.restore();
}},

// ── 3 深海精灵 ──────────────────────────────
{name:'深海精灵',desc:'来自深渊的萤光使者',accent:'#00E5FF',glow:'rgba(0,229,255,.5)',
 draw(x,y,wa,bl,t){
  const c=ctx; c.save(); c.translate(x,y);
  c.shadowColor='rgba(0,220,255,.6)'; c.shadowBlur=28;
  // bubbles
  for(let i=0;i<4;i++){
    const ph=t*2+i*1.8;
    c.globalAlpha=Math.max(0,.6-i*.12);
    c.strokeStyle='rgba(0,220,255,.7)'; c.lineWidth=1;
    c.beginPath(); c.arc(18+Math.sin(ph)*5+i*6,Math.sin(ph*1.3)*4,2+i*.5,0,6.28); c.stroke();
  }
  c.globalAlpha=1;
  // dorsal fin
  c.save(); c.rotate(wa*.4);
  c.beginPath(); c.moveTo(-2,-18); c.bezierCurveTo(5,-28,12,-26,15,-18);
  c.bezierCurveTo(10,-18,2,-18,-2,-18); c.closePath();
  const dfg=c.createLinearGradient(-2,-28,15,-18);
  dfg.addColorStop(0,'rgba(0,200,255,.7)'); dfg.addColorStop(1,'rgba(0,100,200,.4)');
  c.fillStyle=dfg; c.fill(); c.restore();
  // pectoral fin
  c.save(); c.rotate(wa);
  c.beginPath(); c.moveTo(4,6); c.bezierCurveTo(0,16,16,22,20,14);
  c.bezierCurveTo(22,8,16,2,8,3); c.bezierCurveTo(6,4,4,5,4,6); c.closePath();
  const pfg=c.createLinearGradient(4,6,20,14);
  pfg.addColorStop(0,'rgba(0,220,255,.65)'); pfg.addColorStop(1,'rgba(0,100,200,.35)');
  c.fillStyle=pfg; c.fill(); c.restore();
  // tail fin
  c.save(); c.translate(20,0);
  c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(5,-8,12,-6,14,0); c.bezierCurveTo(12,6,5,8,0,0); c.closePath();
  c.fillStyle='rgba(0,180,255,.5)'; c.fill(); c.restore();
  // body
  c.beginPath(); c.moveTo(-14,2);
  c.bezierCurveTo(-14,-18,4,-24,16,-12);
  c.bezierCurveTo(22,-5,22,8,14,16);
  c.bezierCurveTo(6,22,-4,20,-10,12);
  c.bezierCurveTo(-15,8,-16,5,-14,2); c.closePath();
  const gb=c.createRadialGradient(0,-4,2,0,-2,22);
  gb.addColorStop(0,'rgba(180,240,255,.92)'); gb.addColorStop(.45,'rgba(0,200,255,.75)');
  gb.addColorStop(.8,'rgba(0,100,200,.6)'); gb.addColorStop(1,'rgba(0,50,150,.5)');
  c.fillStyle=gb; c.fill(); c.strokeStyle='rgba(0,220,255,.5)'; c.lineWidth=1.5; c.stroke();
  // bioluminescent spots
  [[0,-8],[6,-2],[-4,4]].forEach(([sx,sy])=>{
    const sg=c.createRadialGradient(sx,sy,0,sx,sy,5);
    sg.addColorStop(0,'rgba(100,255,255,.8)'); sg.addColorStop(1,'transparent');
    c.fillStyle=sg; c.beginPath(); c.arc(sx,sy,5,0,6.28); c.fill();
  });
  // angler light
  c.save(); c.translate(-10,-20);
  c.strokeStyle='rgba(0,200,255,.6)'; c.lineWidth=1.2;
  c.beginPath(); c.moveTo(0,0); c.bezierCurveTo(-5,-5,-8,-8,-6,-14); c.stroke();
  const alg=c.createRadialGradient(-6,-14,0,-6,-14,6);
  alg.addColorStop(0,'rgba(100,255,255,.9)'); alg.addColorStop(1,'transparent');
  c.fillStyle=alg; c.beginPath(); c.arc(-6,-14,6,0,6.28); c.fill();
  c.restore();
  // eyes
  [[-7,-6],[3,-6]].forEach(([ex,ey])=>{
    if(bl<.4){
      c.beginPath(); c.arc(ex,ey,6,0,6.28); c.fillStyle='rgba(200,255,255,.95)'; c.fill();
      c.beginPath(); c.arc(ex+.5,ey+.5,4,0,6.28); c.fillStyle='rgba(0,80,180,.9)'; c.fill();
      c.beginPath(); c.arc(ex+1.5,ey-1.5,1.8,0,6.28); c.fillStyle='rgba(255,255,255,.9)'; c.fill();
    }else{
      c.beginPath(); c.moveTo(ex-5,ey); c.lineTo(ex+5,ey);
      c.strokeStyle='rgba(0,200,255,.8)'; c.lineWidth=2; c.stroke();
    }
  });
  c.restore();
}},

// ── 4 烈焰凤凰 ──────────────────────────────
{name:'烈焰凤凰',desc:'传说中永生的火焰战神',accent:'#FF6D00',glow:'rgba(255,110,0,.55)',
 draw(x,y,wa,bl,t){
  const c=ctx; c.save(); c.translate(x,y);
  c.shadowColor='rgba(255,120,0,.6)'; c.shadowBlur=28;
  // flame tail
  for(let i=3;i>=0;i--){
    const ph=t*4+i*.8;
    c.save(); c.translate(18,0);
    const fg=c.createLinearGradient(0,0,12+i*5,0);
    fg.addColorStop(0,`rgba(255,${60+i*40},0,.85)`);
    fg.addColorStop(.5,`rgba(255,${160+i*20},0,.5)`);
    fg.addColorStop(1,'rgba(255,200,0,0)');
    c.strokeStyle=fg; c.lineWidth=4-i*.5; c.lineCap='round';
    c.beginPath(); c.moveTo(0,(i-1.5)*5);
    c.bezierCurveTo(6+Math.sin(ph)*3,(i-1.5)*5+Math.cos(ph)*4,10+Math.sin(ph*1.3)*4,(i-1.5)*6+Math.sin(ph*.7)*5,14+i*4+Math.sin(ph)*3,(i-1.5)*8+Math.cos(ph*1.1)*6);
    c.stroke(); c.restore();
  }
  // upper wing
  c.save(); c.rotate(wa*.7);
  c.beginPath(); c.moveTo(-2,-8);
  c.bezierCurveTo(-8,-20,8,-26,20,-16);
  c.bezierCurveTo(26,-10,24,-2,18,2);
  c.bezierCurveTo(10,6,2,2,-2,-8); c.closePath();
  const uwg=c.createLinearGradient(-2,-26,20,2);
  uwg.addColorStop(0,'#FF6F00'); uwg.addColorStop(.5,'#FF8F00'); uwg.addColorStop(1,'#FFD740');
  c.fillStyle=uwg; c.fill();
  // wing flame tips
  c.strokeStyle='rgba(255,220,0,.6)'; c.lineWidth=1;
  [[2,-22],[10,-24],[18,-18]].forEach(([px,py])=>{
    c.beginPath(); c.moveTo(px,py); c.lineTo(px+Math.sin(t*5)*3-2,py-6); c.stroke();
  });
  c.restore();
  // lower wing
  c.save(); c.rotate(wa*.4+.3);
  c.beginPath(); c.moveTo(4,6); c.bezierCurveTo(-2,16,14,24,20,16);
  c.bezierCurveTo(24,10,18,2,8,4); c.closePath();
  const lwg=c.createLinearGradient(4,6,20,16);
  lwg.addColorStop(0,'#E65100'); lwg.addColorStop(1,'#FF8F00');
  c.fillStyle=lwg; c.fill(); c.restore();
  // body
  c.beginPath(); c.moveTo(-16,2);
  c.bezierCurveTo(-14,-18,4,-24,16,-12);
  c.bezierCurveTo(24,-4,22,10,14,18);
  c.bezierCurveTo(6,24,-4,22,-10,14);
  c.bezierCurveTo(-16,9,-18,7,-16,2); c.closePath();
  const bg=c.createRadialGradient(-2,-6,2,2,-2,24);
  bg.addColorStop(0,'#FFF176'); bg.addColorStop(.4,'#FFCA28'); bg.addColorStop(.75,'#FF8F00'); bg.addColorStop(1,'#E65100');
  c.fillStyle=bg; c.fill(); c.strokeStyle='rgba(255,100,0,.3)'; c.lineWidth=1.5; c.stroke();
  // crown
  [[-8,-20],[-4,-23],[0,-22],[4,-23],[8,-21]].forEach(([fx,fy],fi)=>{
    c.save(); c.translate(fx+2,fy);
    const flh=c.createLinearGradient(0,0,0,-8);
    flh.addColorStop(0,'rgba(255,120,0,.9)'); flh.addColorStop(1,'rgba(255,220,0,0)');
    c.strokeStyle=flh; c.lineWidth=2; c.lineCap='round';
    c.beginPath(); c.moveTo(0,0); c.lineTo(Math.sin(t*6+fi)*2,-7-Math.abs(Math.sin(t*3+fi))*4); c.stroke();
    c.restore();
  });
  // eye
  c.beginPath(); c.ellipse(-6,-5,9,8,-0.1,0,Math.PI*2); c.fillStyle='#fff'; c.fill();
  if(bl<.4){
    c.beginPath(); c.arc(-4,-5,5.5,0,6.28); c.fillStyle='#B71C1C'; c.fill();
    c.beginPath(); c.arc(-2,-7.5,2,0,6.28); c.fillStyle='rgba(255,255,255,.9)'; c.fill();
  }else{
    c.beginPath(); c.moveTo(-14,-6); c.bezierCurveTo(-8,-2,-2,-1,2,-5);
    c.strokeStyle='#B71C1C'; c.lineWidth=2.5; c.stroke();
  }
  // beak
  c.beginPath(); c.moveTo(-14,-1); c.lineTo(-26,1); c.lineTo(-18,7); c.closePath();
  c.fillStyle='#FF6D00'; c.fill(); c.restore();
}},
];

// ── State ─────────────────────────────────────
let G={scene:'menu',skin:0,score:0,coins:0,totalCoins:0,curLv:1,bestScore:0,
  flash:0,flashC:'#fff',shake:0,shakeM:0};
let banner={show:0,lv:0,timer:0,alpha:0};
function checkLvUp(s){
  const lv=getLv(s);
  if(lv>G.curLv){G.curLv=lv; banner={show:1,lv,timer:2.8,alpha:0};}
}

let bird,pipes,coinList,parts,clouds,bgSt;
let windF=0,windT=0,windTmr=0,pipeT=0,uiT=0,readyT=0,mtnOff=0;
let skPrev=0,skBob=0,goAnim=0;

function initWorld(){
  clouds=Array.from({length:9},mkCloud);
  bgSt=Array.from({length:80},()=>({x:R(0,W),y:R(0,H*.68),r:R(.3,2.1),tw:R(0,6.28),s:R(.4,1.8)}));
  parts=[];mtnOff=0;
}
function mkCloud(){return{x:R(-80,W+80),y:R(28,H*.5),sc:R(.5,1.3),spd:R(14,48),al:R(.28,.75)};}
function resetBird(){
  bird={x:100,y:H/2-38,vy:0,ang:0,wa:0,wd:1,alive:true,blink:0,blinkT:3,trail:[]};
}
function startGame(){
  G.score=0;G.coins=0;G.curLv=1;
  pipes=[];coinList=[];parts=[];
  pipeT=0;windF=0;windT=0;windTmr=0;
  banner={show:0,lv:1,timer:0,alpha:0};
  resetBird();readyT=0;G.scene='ready';
}

// ── Loop ──────────────────────────────────────
let lastT=0;
function loop(now){
  requestAnimationFrame(loop);
  const dt=Math.min((now-lastT)/1000,.05);lastT=now;
  uiT+=dt;skBob+=dt;
  tickClouds(dt);
  if(G.flash>0)G.flash-=dt;
  if(G.shake>0)G.shake-=dt;
  if(G.scene==='ready'){readyT+=dt;bird.wa=Math.sin(readyT*4.8)*.3;bird.ang=Math.sin(readyT*2.1)*.09;bird.y=H/2-38+Math.sin(readyT*2.1)*9;}
  else if(G.scene==='playing')tickPlay(dt);
  else if(G.scene==='gameOver'){goAnim+=dt;tickParts(dt);}
  if(banner.show&&banner.timer>0){
    banner.timer-=dt;
    banner.alpha=banner.timer>2?Math.min(1,(2.8-banner.timer)*4):Math.min(1,banner.timer*3);
    if(banner.timer<=0)banner.show=0;
  }
  drawFrame(now/1000);
}

function tickPlay(dt){
  const d=D(G.score);
  mtnOff+=d.spd*.012*dt;
  if(d.wind){windTmr-=dt;if(windTmr<=0){windT=R(-100,100);windTmr=R(1.8,4.5);}windF+=(windT-windF)*dt*1.25;}
  else{windF*=(1-dt*3);}
  if(bird.alive){
    bird.vy+=1900*dt;bird.vy=Math.min(bird.vy,720);
    if(d.wind)bird.vy+=windF*dt*.42;
    bird.y+=bird.vy*dt;bird.ang=clamp(bird.vy/700*1.3,-.48,1.45);
    bird.wa+=bird.wd*7*dt;if(Math.abs(bird.wa)>.5)bird.wd*=-1;
    bird.blinkT-=dt;if(bird.blinkT<0){bird.blink=bird.blink?.04:.13;bird.blinkT=bird.blink?.13:R(2,5);}
    bird.trail.unshift({x:bird.x,y:bird.y,l:1});
    if(bird.trail.length>10)bird.trail.pop();
    bird.trail.forEach(tr=>tr.l-=dt*5);
    if(bird.y+BR>H-GND||bird.y-BR<0)killBird();
  }else{bird.vy+=1900*dt;bird.y+=bird.vy*dt;}
  pipeT-=dt;if(pipeT<=0){spawnPipe();pipeT=d.ivl/1000;}
  pipes.forEach(p=>{
    p.x-=d.spd*dt;
    if(p.mvA){p.ph+=p.mvS*dt;p.gapY+=Math.sin(p.ph)*p.mvS*dt*20;p.gapY=clamp(p.gapY,p.gap/2+32,H-GND-p.gap/2-32);}
    if(!p.ok&&p.x<bird.x-BR){p.ok=true;G.score++;checkLvUp(G.score);burst(bird.x+22,bird.y,'#FFD740',6,72);}
    if(bird.alive&&pipeHit(bird,p)){G.shake=.38;G.shakeM=13;G.flash=.22;G.flashC='#ff3030';killBird();}
  });
  pipes=pipes.filter(p=>p.x>-PW*2);
  coinList.forEach(c=>{
    if(!c.done){c.x-=d.spd*dt;c.bob+=dt*3;
      if(bird.alive&&d2(bird.x,bird.y,c.x,c.y+Math.sin(c.bob)*5)<(BR+c.r)**2){
        c.done=true;G.coins++;G.totalCoins++;burst(c.x,c.y,'#FFD740',8,100);G.flash=.06;G.flashC='#FFD740';}}
  });
  coinList=coinList.filter(c=>c.x>-60&&!c.done);
  tickParts(dt);
  if(!bird.alive&&bird.y>H+90){G.bestScore=Math.max(G.bestScore,G.score);goAnim=0;G.scene='gameOver';}
}
function killBird(){
  if(!bird.alive)return;bird.alive=false;
  burst(bird.x,bird.y,SK[G.skin].accent,22,165);burst(bird.x,bird.y,'#fff',8,110);
}
function spawnPipe(){
  const d=D(G.score);
  const gapY=R(d.gap/2+50,H-GND-d.gap/2-50);
  const mv=d.mv?R(30,70):0;
  pipes.push({x:W+PW/2+14,gapY,gap:d.gap,mvA:mv,ph:R(0,6.28),mvS:R(.7,1.4),ok:false});
  if(R(0,1)<.62)coinList.push({x:W+PW/2+PW+R(18,55),y:gapY+R(-d.gap*.25,d.gap*.25),r:11,bob:R(0,6.28),done:false});
}
function pipeHit(b,p){
  const br=BR*.76,pw=PW/2+PCAP;
  if(b.x+br<p.x-pw||b.x-br>p.x+pw)return false;
  return b.y-br<p.gapY-p.gap/2||b.y+br>p.gapY+p.gap/2;
}

// ── Draw ──────────────────────────────────────
function drawFrame(t){
  ctx.clearRect(0,0,W,H);
  if(G.scene==='menu')dMenu(t);
  else if(G.scene==='skinSelect')dSkin(t);
  else if(G.scene==='ready')dReady(t);
  else if(G.scene==='playing')dPlay(t);
  else if(G.scene==='gameOver')dGO(t);
}

function dSky(lv=1){
  const t1=(lv-1)/9;
  const g=ctx.createLinearGradient(0,0,0,H*.75);
  g.addColorStop(0,lerpC('#2a5298','#08143a',t1)); g.addColorStop(1,lerpC('#0d2060','#02060f',t1));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
  if(lv<=5){
    const aa=(1-t1*2)*.12;if(aa>0){
      const ag=ctx.createLinearGradient(0,60,0,200);
      ag.addColorStop(0,`rgba(30,200,120,${aa})`); ag.addColorStop(.5,`rgba(60,120,255,${aa*.5})`); ag.addColorStop(1,'transparent');
      ctx.fillStyle=ag;ctx.fillRect(0,60,W,140);
    }
  }
}
function dStars(){
  bgSt.forEach(s=>{s.tw+=.015*s.s;ctx.globalAlpha=clamp(.12+Math.sin(s.tw)*.38,0,1);ctx.fillStyle='#cce0ff';ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,6.28);ctx.fill();});ctx.globalAlpha=1;
}
function dMtns(lv=1){
  const t1=(lv-1)/9;
  MTN.forEach(m=>{
    const off=mtnOff*m.spd;ctx.beginPath();ctx.moveTo(-2,H);
    for(let i=0;i<=90;i++){
      const x=(i/90)*(W+4)-2,tx2=(i/90+off)%1,idx=tx2*m.pts.length;
      const i0=Math.floor(idx),i1=(i0+1)%m.pts.length,fr=idx-i0;
      ctx.lineTo(x,H*m.baseY-(m.pts[i0]+(m.pts[i1]-m.pts[i0])*fr)*m.amp-t1*20);
    }
    ctx.lineTo(W+2,H);ctx.closePath();ctx.fillStyle=m.color;ctx.fill();
  });
}
function tickClouds(dt){
  const sp=G.scene==='playing'?D(G.score).spd:60;
  clouds.forEach(c=>{c.x-=c.spd*dt*(sp/150);if(c.x<-150){c.x=W+80;c.y=R(28,H*.5);}});
}
function dClouds(){
  clouds.forEach(c=>{
    ctx.save();ctx.globalAlpha=c.al*.55;ctx.scale(c.sc,c.sc*.55);
    const cx=c.x/c.sc,cy=c.y/(c.sc*.55);
    const g=ctx.createRadialGradient(cx,cy,4,cx,cy,56);
    g.addColorStop(0,'rgba(255,255,255,.9)');g.addColorStop(1,'rgba(200,225,255,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,32,0,6.28);ctx.arc(cx+32,cy-10,22,0,6.28);ctx.arc(cx-26,cy-5,20,0,6.28);ctx.arc(cx+14,cy+12,18,0,6.28);ctx.fill();ctx.restore();
  });
}
function dGround(){
  const gy=H-GND;
  const g=ctx.createLinearGradient(0,gy,0,H);
  g.addColorStop(0,'#2a5c1a');g.addColorStop(.3,'#1e4812');g.addColorStop(.6,'#4a2c10');g.addColorStop(1,'#1e1008');
  ctx.fillStyle=g;ctx.fillRect(0,gy,W,GND);
  ctx.fillStyle='rgba(80,200,60,.08)';ctx.fillRect(0,gy,W,1.5);
  ctx.fillStyle='#3a7a2a';
  for(let x=0;x<W;x+=14){const h=4+Math.sin(x*.3+uiT*.5)*2;ctx.fillRect(x,gy-h+1,2,h);}
}
function dPipe(p){
  const topH=p.gapY-p.gap/2,botY=p.gapY+p.gap/2,botH=H-GND-botY;
  const gapGlow=ctx.createRadialGradient(p.x,p.gapY,0,p.x,p.gapY,p.gap/2);
  gapGlow.addColorStop(0,'rgba(50,180,50,.07)');gapGlow.addColorStop(1,'transparent');
  ctx.fillStyle=gapGlow;ctx.fillRect(p.x-PW/2-PCAP-10,p.gapY-p.gap/2,PW+PCAP*2+20,p.gap);
  function body(x,y,w,h){
    if(h<=0)return;
    const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
    g.addColorStop(0,'#163d12');g.addColorStop(.28,'#2d7a20');g.addColorStop(.55,'#35922a');g.addColorStop(.82,'#236018');g.addColorStop(1,'#102c0c');
    ctx.fillStyle=g;ctx.fillRect(x-w/2,y,w,h);
    ctx.fillStyle='rgba(255,255,255,.09)';ctx.fillRect(x-w/2+5,y,7,h);
    ctx.fillStyle='rgba(0,0,0,.15)';ctx.fillRect(x+w/2-8,y,8,h);
  }
  function cap(x,y,w,h){
    if(h<=0)return;
    const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
    g.addColorStop(0,'#122e0f');g.addColorStop(.35,'#287020');g.addColorStop(.65,'#30882a');g.addColorStop(1,'#122e0f');
    ctx.fillStyle=g;ctx.beginPath();ctx.roundRect(x-w/2,y,w,h,3);ctx.fill();
    ctx.fillStyle='rgba(255,255,255,.1)';ctx.beginPath();ctx.roundRect(x-w/2+4,y+2,w-8,h*.45,2);ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.2)';ctx.lineWidth=1;ctx.beginPath();ctx.roundRect(x-w/2,y,w,h,3);ctx.stroke();
  }
  body(p.x,0,PW,topH);cap(p.x,topH-26,PW+PCAP*2,26);
  const bh=botH-26>0?botH-26:0;body(p.x,botY+26,PW,bh);cap(p.x,botY,PW+PCAP*2,26);
}
function dCoin(c){
  if(c.done)return;
  const dy=Math.sin(c.bob)*5,cy2=c.y+dy;
  ctx.save();ctx.shadowColor='#FFD740';ctx.shadowBlur=14;
  const g=ctx.createRadialGradient(c.x-3,cy2-3,0,c.x,cy2,c.r);
  g.addColorStop(0,'#FFF9C4');g.addColorStop(.5,'#FFD600');g.addColorStop(1,'#F57F17');
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(c.x,cy2,c.r,0,6.28);ctx.fill();
  ctx.strokeStyle='#F9A825';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(c.x,cy2,c.r,0,6.28);ctx.stroke();
  ctx.fillStyle='rgba(130,60,0,.75)';ctx.font='bold 9px system-ui';ctx.textAlign='center';ctx.fillText('¥',c.x,cy2+3.5);
  ctx.restore();
}
function dParts(){
  parts.forEach(p=>{ctx.globalAlpha=Math.max(0,p.l);ctx.fillStyle=p.c;ctx.beginPath();ctx.arc(p.x,p.y,p.r*Math.max(0,p.l),0,6.28);ctx.fill();});ctx.globalAlpha=1;
}
function dBanner(){
  if(!banner.show||banner.alpha<=0)return;
  const bh=44,by=18,bw=224,bx=W/2-bw/2;
  ctx.save();ctx.globalAlpha=banner.alpha;
  ctx.fillStyle='rgba(0,0,0,.58)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.fill();
  ctx.strokeStyle=SK[G.skin].accent;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(bx,by,bw,bh,bh/2);ctx.stroke();
  ctx.shadowColor=SK[G.skin].accent;ctx.shadowBlur=12;
  tx(`✦  难度升级  Level ${banner.lv}  ✦`,W/2,by+bh/2+6,15,SK[G.skin].accent,'700');
  ctx.restore();
}

  gCard(10,10,68,28,14,'rgba(0,0,0,.45)',null);tx('Lv.'+lv,44,29,14,lvC,'800');
  gCard(W-80,10,70,28,14,'rgba(0,0,0,.45)',null);tx('🪙 '+G.coins,W-45,29,13,'#FFD740','700');
  const bw=144,bh=5,bx=(W-bw)/2,by=63;
  ctx.fillStyle='rgba(255,255,255,.12)';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,2.5);ctx.fill();
  if(G.curLv<10){
    const prog=(G.score-(G.curLv-1)*5)/5;
    const pc=lv>=8?'#FF6B6B':lv>=5?'#FFB74D':'#43A047';
    ctx.fillStyle=pc;ctx.beginPath();ctx.roundRect(bx,by,bw*clamp(prog,0,1),bh,2.5);ctx.fill();
  }else{ctx.fillStyle='#FFD740';ctx.beginPath();ctx.roundRect(bx,by,bw,bh,2.5);ctx.fill();}
}

function dGO(t){
  dSky(G.curLv);dStars();dMtns(G.curLv);dClouds();dGround();dParts();
  ctx.fillStyle='rgba(0,0,0,.52)';ctx.fillRect(0,0,W,H);
  ctx.save();ctx.shadowColor='#FF4444';ctx.shadowBlur=50;
  tx('飞行失败',W/2,128+Math.sin(goAnim*2)*2,50,'#FF6B6B','900');
  ctx.shadowBlur=0;ctx.restore();
  const py=196;
  gCard(W/2-138,py,276,178,20,'rgba(10,20,50,.78)','rgba(255,255,255,.08)');
  tx('得分',W/2-68,py+34,13,'rgba(180,180,180,.8)');
  ctx.save();ctx.shadowColor='#FFD740';ctx.shadowBlur=15;
  tx(G.score+'',W/2-68,py+74,44,'#FFD740','900');ctx.restore();
  tx('最高关卡',W/2+68,py+34,13,'rgba(180,180,180,.8)');
  const lvC=G.curLv>=8?'#FF6B6B':G.curLv>=5?'#FFB74D':'#81D4FA';
  tx('Lv.'+G.curLv,W/2+68,py+74,36,lvC,'900');
  ctx.fillStyle='rgba(255,255,255,.1)';ctx.fillRect(W/2-.5,py+14,.5,150);
  const isNew=G.score===G.bestScore&&G.score>0;
  tx('🪙 '+G.coins+'  ·  '+(isNew?'🏆 新纪录 '+G.bestScore:'最高 '+G.bestScore),W/2,py+112,14,isNew?'#FFD740':'rgba(200,200,200,.75)',isNew?'700':'400');
  const tips=['节奏是关键，别乱点！','接近管道边缘才是高分路线','收集金币，加油！','风力出现时要更冷静'];
  tx('💡 '+tips[Math.floor(uiT*.5)%4],W/2,py+148,12,'rgba(150,190,255,.65)');
  btn(W/2,428,230,56,'再来一局','#C62828','#fff');
  btn(W/2,497,230,46,'更换装扮','#1565C0','#fff');
  btn(W/2,554,230,40,'返回主页','rgba(255,255,255,.08)','#aaa');
}

// ── UI helpers ────────────────────────────────
function btn(cx,cy,w,h,label,bg,fg){
  const x=cx-w/2,y=cy-h/2;ctx.save();
  ctx.shadowColor='rgba(0,0,0,.55)';ctx.shadowBlur=14;ctx.shadowOffsetY=5;
  ctx.fillStyle=bg;ctx.beginPath();ctx.roundRect(x,y,w,h,h/2);ctx.fill();
  ctx.shadowBlur=0;ctx.shadowOffsetY=0;
  ctx.fillStyle='rgba(255,255,255,.18)';ctx.beginPath();ctx.roundRect(x+2,y+2,w-4,h*.44,h*.44);ctx.fill();
  ctx.fillStyle=fg;ctx.font='800 17px system-ui';ctx.textAlign='center';ctx.fillText(label,cx,cy+6.5);
  ctx.restore();
}
function gCard(x,y,w,h,r,fill,stroke){
  ctx.fillStyle=fill||'rgba(255,255,255,.07)';ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1.5;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.stroke();}
}
function tx(s,x,y,sz,c,w){ctx.font=`${w||'400'} ${sz}px system-ui`;ctx.textAlign='center';ctx.fillStyle=c;ctx.fillText(s,x,y);}
function circ(x,y,r,c){ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,6.28);ctx.fill();}
function arrowBtn(x,y,d){
  ctx.save();ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();
  if(d==='L'){ctx.moveTo(x+14,y-18);ctx.lineTo(x-4,y);ctx.lineTo(x+14,y+18);}
  else{ctx.moveTo(x-14,y-18);ctx.lineTo(x+4,y);ctx.lineTo(x-14,y+18);}
  ctx.closePath();ctx.fill();ctx.restore();
}

// ── Particles ─────────────────────────────────
function burst(x,y,c,n,spd){
  for(let i=0;i<n;i++){const a=Math.random()*6.28,s=R(spd*.3,spd);parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-R(0,42),l:1,dc:R(.7,1.5),r:R(2.5,6),c});}
}
function tickParts(dt){parts.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=185*dt;p.l-=p.dc*dt;});parts=parts.filter(p=>p.l>0);}

// ── Input ─────────────────────────────────────
function tap(ex,ey){
  const rect=cv.getBoundingClientRect(),s=parseFloat(cv.style.width)/W;
  const cx=(ex-rect.left)/s,cy=(ey-rect.top)/s;
  if(G.scene==='menu'){
    if(H$(cx,cy,W/2,376,220,54)){G.skin=skPrev;startGame();}
    else if(H$(cx,cy,W/2,445,220,50)){skPrev=G.skin;G.scene='skinSelect';}
  }
  else if(G.scene==='skinSelect'){
    if(H$(cx,cy,W/2,H-80,220,50)){G.skin=skPrev;G.scene='menu';}
    else if(cx<W/3&&skPrev>0)skPrev--;
    else if(cx>W*2/3&&skPrev<SK.length-1)skPrev++;
  }
  else if(G.scene==='ready'){bird.vy=-525;burst(bird.x-8,bird.y+8,SK[G.skin].glow,4,42);G.scene='playing';}
  else if(G.scene==='playing'){if(bird.alive){bird.vy=-525;bird.wa=-.42;burst(bird.x-8,bird.y+8,SK[G.skin].glow,4,42);}}
  else if(G.scene==='gameOver'){
    if(H$(cx,cy,W/2,428,230,56))startGame();
    else if(H$(cx,cy,W/2,497,230,46)){skPrev=G.skin;G.scene='skinSelect';}
    else if(H$(cx,cy,W/2,554,230,40))G.scene='menu';
  }
}
function H$(cx,cy,bx,by,w,h){return cx>bx-w/2&&cx<bx+w/2&&cy>by-h/2&&cy<by+h/2;}
cv.addEventListener('pointerdown',e=>{e.preventDefault();tap(e.clientX,e.clientY);},{passive:false});
let tSX=0;
cv.addEventListener('touchstart',e=>tSX=e.touches[0].clientX,{passive:true});
cv.addEventListener('touchend',e=>{
  if(G.scene==='skinSelect'){const dx=(e.changedTouches[0].clientX-tSX)/(parseFloat(cv.style.width)/W);if(dx<-45&&skPrev<SK.length-1)skPrev++;else if(dx>45&&skPrev>0)skPrev--;}
},{passive:true});
document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){e.preventDefault();
    if(G.scene==='ready'){bird.vy=-525;G.scene='playing';}
    else if(G.scene==='playing'&&bird.alive){bird.vy=-525;bird.wa=-.42;}
  }
});

// ── Utils ─────────────────────────────────────
function R(a,b){return a+Math.random()*(b-a);}
function clamp(v,lo,hi){return Math.max(lo,Math.min(hi,v));}
function d2(x1,y1,x2,y2){return(x1-x2)**2+(y1-y2)**2;}
function lerpC(c1,c2,t){
  const p=s=>parseInt(s,16);
  const r1=p(c1.slice(1,3)),g1=p(c1.slice(3,5)),b1=p(c1.slice(5,7));
  const r2=p(c2.slice(1,3)),g2=p(c2.slice(3,5)),b2=p(c2.slice(5,7));
  return`rgb(${Math.round(r1+(r2-r1)*t)},${Math.round(g1+(g2-g1)*t)},${Math.round(b1+(b2-b1)*t)})`;
}

initWorld();resetBird();
requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop);});
</script>
