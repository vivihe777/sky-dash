// ==================== HELPERS ====================
const R=(a,b)=>a+(Math.random()*(b-a));
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const d2=(ax,ay,bx,by)=>((ax-bx)**2+(ay-by)**2);
function lerpC(a,b,t){
  const p=(v,i)=>parseInt(v.slice(1+i*2,3+i*2),16);
  const r=c=>[p(c,0),p(c,1),p(c,2)];
  const [ar,ag,ab]=r(a),[br,bg,bb]=r(b);
  return`rgb(${Math.round(ar+(br-ar)*t)},${Math.round(ag+(bg-ag)*t)},${Math.round(ab+(bb-ab)*t)})`;
}
function H$(n){let h='';for(let i=0;i<n;i++)h+=Math.random().toString(36)[2]||'0';return h;}
function uuid(){return H$(8)+'-'+H$(4)+'-4'+H$(3)+'-'+H$(4)+'-'+H$(12);}

// ==================== PLAYER DATA ====================
let P={};
function defaultPlayer(){
  return{id:uuid(),coins:0,highScore:0,inventory:{shield:0,hourglass:0},activeEffect:null,
         ownedEffects:[],ownedSkins:[0,1,2,3,4],equippedSkin:0,nickname:'',localBoard:[]};
}
function loadPlayer(){
  try{const s=localStorage.getItem('sky_dash_v6');P=s?JSON.parse(s):defaultPlayer();}
  catch(e){P=defaultPlayer();}
  if(!P.id)P.id=uuid();
  if(!P.ownedSkins)P.ownedSkins=[0,1,2,3,4];
  if(!P.ownedEffects)P.ownedEffects=[];
  if(!P.inventory)P.inventory={shield:0,hourglass:0};
  if(!P.localBoard)P.localBoard=[];
  if(typeof P.activeEffect==='undefined')P.activeEffect=null;
  if(typeof P.equippedSkin==='undefined')P.equippedSkin=0;
}
function savePlayer(){
  try{localStorage.setItem('sky_dash_v6',JSON.stringify(P));}catch(e){}
}

// ==================== SUPABASE HELPERS ====================
async function sbFetch(path,method,body){
  if(!SB_URL)return null;
  try{
    const r=await fetch(SB_URL+path,{
      method,headers:{'Content-Type':'application/json','apikey':SB_KEY,'Authorization':'Bearer '+SB_KEY},
      body:body?JSON.stringify(body):undefined
    });
    return r.ok?await r.json():null;
  }catch(e){return null;}
}
async function syncPlayer(){
  if(!SB_URL)return;
  sbFetch('/rest/v1/players','POST',{id:P.id,coins:P.coins,high_score:P.highScore,nickname:P.nickname});
}
async function submitScore(score,level){
  const nickname=P.nickname||('玩家'+P.id.slice(0,4));
  if(score>P.highScore){P.highScore=score;savePlayer();}
  const entry={nickname,score,level,player_id:P.id};
  if(!P.localBoard)P.localBoard=[];
  P.localBoard.push(entry);
  P.localBoard.sort((a,b)=>b.score-a.score);
  if(P.localBoard.length>20)P.localBoard.length=20;
  savePlayer();
  sbFetch('/rest/v1/game_sessions','POST',entry);
}
async function fetchLeaderboard(){
  if(!SB_URL)return P.localBoard||[];
  const data=await sbFetch('/rest/v1/game_sessions?order=score.desc&limit=20','GET');
  return data||P.localBoard||[];
}

// ==================== MOUNTAIN PROFILES ====================
function genMtn(seed,n){
  const pts=[];let x=0,y=0.5;
  const lcg=s=>{let v=s;return()=>{v=(1664525*v+1013904223)>>>0;return v/4294967296;}};
  const rng=lcg(seed);
  for(let i=0;i<=n;i++){
    pts.push({x:x,y:y});
    x+=W/n*(0.8+rng()*0.4);
    y=clamp(y+(rng()-0.5)*0.3,0.1,0.9);
  }
  return pts;
}
const MTN=[
  {pts:genMtn(42,12),scale:0.38,spd:18,color:'rgba(40,50,100,0.7)'},
  {pts:genMtn(137,9),scale:0.28,spd:28,color:'rgba(60,30,90,0.5)'},

];

    petalXs.forEach((px,i)=>{
      const py=Math.sin(t*3+i*1.2)*4;
      ctx.fillStyle='rgba(255,182,193,.7)';
      ctx.beginPath();
      // Petal shape
      ctx.save();ctx.translate(px,py);ctx.rotate(t+i);
      ctx.ellipse(0,0,3,5,0,0,Math.PI*2);
      ctx.restore();
      ctx.fill();
    });
    // Butterfly wings
    ctx.save();ctx.rotate(wa*.6);
    // Left top wing
    const twg=ctx.createRadialGradient(0,-18,2,0,-10,20);
    twg.addColorStop(0,'rgba(255,192,203,.85)');twg.addColorStop(1,'rgba(255,105,180,.15)');
    ctx.fillStyle=twg;
    ctx.beginPath();ctx.moveTo(0,-4);ctx.bezierCurveTo(-20,-30,-30,-20,-20,-4);ctx.closePath();ctx.fill();
    ctx.strokeStyle='rgba(255,100,150,.4)';ctx.lineWidth=1;ctx.stroke();
    // Left bottom wing
    ctx.fillStyle='rgba(255,192,203,.65)';
    ctx.beginPath();ctx.moveTo(0,4);ctx.bezierCurveTo(-18,20,-22,28,-10,10);ctx.closePath();ctx.fill();
    // Right top wing
    const rwg=ctx.createRadialGradient(0,-18,2,0,-10,20);
    rwg.addColorStop(0,'rgba(255,192,203,.75)');rwg.addColorStop(1,'rgba(255,105,180,.12)');
    ctx.fillStyle=rwg;
    ctx.beginPath();ctx.moveTo(0,-4);ctx.bezierCurveTo(20,-30,30,-20,20,-4);ctx.closePath();ctx.fill();
    // Right bottom wing
    ctx.fillStyle='rgba(255,192,203,.6)';
    ctx.beginPath();ctx.moveTo(0,4);ctx.bezierCurveTo(18,20,22,28,10,10);ctx.closePath();ctx.fill();
    ctx.restore();
    // Body round blob
    const bg=ctx.createRadialGradient(-4,-4,2,0,2,BR);
    bg.addColorStop(0,'#FFE4E1');bg.addColorStop(1,'#FF8FA3');
    ctx.fillStyle=bg;ctx.beginPath();ctx.arc(0,2,BR,0,Math.PI*2);ctx.fill();
    // Flower crown - 5 petals
    const crownR=6;
    for(let i=0;i<5;i++){
      const ca=i/5*Math.PI*2-Math.PI/2;
      ctx.fillStyle=i%2===0?'#FF80AB':'#FFCDD2';
      ctx.beginPath();ctx.arc(Math.cos(ca)*crownR,Math.sin(ca)*crownR-BR+3,3,0,Math.PI*2);ctx.fill();
    }
    // Crown center
    ctx.fillStyle='#FFD700';ctx.beginPath();ctx.arc(0,-BR+3,2.5,0,Math.PI*2);ctx.fill();
    // Large cute eyes
    if(!bl){
      ctx.fillStyle='#fff';ctx.beginPath();ctx.ellipse(-7,-1,6,7,-.2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#F06292';ctx.beginPath();ctx.arc(-6,-1,4,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#880E4F';ctx.beginPath();ctx.arc(-6,-1,2,0,Math.PI*2);ctx.fill();
      ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-7,-3,1.5,0,Math.PI*2);ctx.fill();
    }else{
      ctx.strokeStyle='#F48FB1';ctx.lineWidth=2.5;
      ctx.beginPath();ctx.moveTo(-10,-1);ctx.quadraticCurveTo(-6,-4,-3,-1);ctx.stroke();
    }
    // Blush circles
    ctx.fillStyle='rgba(255,100,120,.22)';
    ctx.beginPath();ctx.ellipse(-10,5,5,3,0,0,Math.PI*2);ctx.fill();
    ctx.beginPath();ctx.ellipse(6,5,5,3,0,0,Math.PI*2);ctx.fill();
    // Tiny beak
    ctx.fillStyle='#FF7043';ctx.beginPath();ctx.moveTo(-12,3);ctx.lineTo(-18,5);ctx.lineTo(-12,7);ctx.closePath();ctx.fill();
    ctx.restore();
  }},
];

// ==================== TRAIL PARTICLES ====================
function spawnTrailParticle(x,y,effectId,t){
  if(trailParticles.length>=80)return;
  let p;
  switch(effectId){
    case'fire':
      p={x,y,vx:R(-15,15),vy:R(-40,-10),life:1,maxLife:1,r:R(2,4),c:Math.random()<.5?'#FF6D00':'#FF3D00'};break;
    case'aurora':
      p={x,y,vx:R(-20,20),vy:R(-30,-5),life:1,maxLife:1,r:R(2,5),c:`hsl(${(t*80+Math.random()*60)%360},100%,70%)`};break;
    case'lightning':
      p={x:x+R(-8,8),y:y+R(-8,8),vx:0,vy:0,life:0.5,maxLife:0.5,r:R(1,3),c:'#E0B0FF'};break;
    case'stardust':
      p={x:x+R(-10,10),y:y+R(-5,5),vx:R(-10,10),vy:R(-20,0),life:1,maxLife:1,r:R(1,2.5),c:'#FFFFF0'};break;
    default:return;
  }
  trailParticles.push(p);
}
function updateTrailParticles(dt){
  for(let i=trailParticles.length-1;i>=0;i--){
    const p=trailParticles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;
    p.life-=dt*1.8;
    if(p.life<=0)trailParticles.splice(i,1);
  }
}
function drawTrailParticles(){
  trailParticles.forEach(p=>{
    ctx.save();
    ctx.globalAlpha=clamp(p.life/p.maxLife,0,1);
    ctx.fillStyle=p.c;
    ctx.shadowColor=p.c;ctx.shadowBlur=4;
    ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill();
    ctx.restore();
  });
}

// ==================== PARTICLE BURST ====================
function burst(x,y,c,n,spd){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2,s=R(20,spd);
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:1,r:R(2,5),c});
  }
}

// ==================== CLOUD GENERATION ====================
function initClouds(){
  clouds=[];
  for(let i=0;i<6;i++){
    clouds.push({x:R(0,W),y:R(30,180),r:R(18,36),spd:R(12,28)});
  }
}
function updateClouds(dt){
  if(G.scene==='playing'||G.scene==='ready'){
    clouds.forEach(c=>{
      c.x-=c.spd*dt*timeScale;
      if(c.x+c.r*2<0)c.x=W+c.r;
    });
  }
}
function drawClouds(){
  clouds.forEach(c=>{
    ctx.fillStyle='rgba(255,255,255,0.1)';
    ctx.beginPath();ctx.arc(c.x,c.y,c.r,0,Math.PI*2);
    ctx.arc(c.x+c.r*.7,c.y-c.r*.3,c.r*.7,0,Math.PI*2);
    ctx.arc(c.x-c.r*.5,c.y-c.r*.2,c.r*.6,0,Math.PI*2);
    ctx.fill();
  });
}

// ==================== MOUNTAINS ====================
function updateMountains(dt){
  if(G.scene==='playing'||G.scene==='ready'){
    MTN.forEach((m,mi)=>{
      mtnOffsets[mi]=(mtnOffsets[mi]+m.spd*dt*timeScale)%W;
    });
  }
}
function drawMountains(){
  MTN.forEach((m,mi)=>{
    ctx.fillStyle=m.color;
    for(let rep=-1;rep<=1;rep++){
      ctx.beginPath();
      ctx.moveTo(-mtnOffsets[mi]+rep*W,H-GND);
      m.pts.forEach(p=>{
        ctx.lineTo(p.x-mtnOffsets[mi]+rep*W,(H-GND)-(p.y*m.scale*(H-GND)));
      });
      ctx.lineTo(W+W,H-GND);
      ctx.closePath();ctx.fill();
    }
  });
}

// ==================== GROUND ====================
function updateGround(dt){
  if(G.scene==='playing'||G.scene==='ready'){
    const spd=D(G.score).spd;
    groundX=(groundX-spd*dt*timeScale)%(W/4);
  }
}
function drawGround(){
  const g=ctx.createLinearGradient(0,H-GND,0,H);
  g.addColorStop(0,'#2E7D32');g.addColorStop(0.3,'#1B5E20');g.addColorStop(1,'#0a1a0a');
  ctx.fillStyle=g;ctx.fillRect(0,H-GND,W,GND);
  ctx.strokeStyle='rgba(255,255,255,0.04)';ctx.lineWidth=1;
  for(let i=0;i<W/24+2;i++){
    const gx=(i*24+groundX+W)%W;
    ctx.beginPath();ctx.moveTo(gx,H-GND);ctx.lineTo(gx,H);ctx.stroke();
  }
  ctx.strokeStyle='rgba(255,255,255,0.15)';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(0,H-GND);ctx.lineTo(W,H-GND);ctx.stroke();
}

// ==================== WORLD INIT ====================
function initWorld(){
  pipes=[];runCoins=[];particles=[];trailParticles=[];
  spawnTimer=0;windT=0;groundX=0;
  mtnOffsets=[0,0,0];
  initClouds();

  runItems={shield:{active:false,used:false},hourglass:{active:false,timer:0,equipped:false}};
}
function resetBird(){
  bird={x:W*.28,y:H*.42,vy:0,alive:true,angle:0,wingAnim:0,blinkT:0,blinkOpen:true};
}

// ==================== PIPE SPAWNING ====================
function spawnPipe(){
  const d=D(G.score);
  const minY=80,maxY=H-GND-d.gap-80;
  const topH=R(minY,maxY);
  const mv=d.mv&&Math.random()>.4;
  const gold=Math.random()<.15;
  pipes.push({
    x:W+PW/2,topH,gap:d.gap,
    mv,mvDir:Math.random()<.5?1:-1,mvSpd:R(30,60),
    passed:false,
    color:gold?'#F9A825':'#43A047',
    rim:gold?'#FFF59D':'#81C784',
    gold
  });
  // Spawn coin near center of gap
  const coinY=topH+d.gap/2;
  if(gold){
    runCoins.push({x:W+PW/2,y:coinY,r:14,c:'#FFD700',val:3,collected:false,glow:true});
  }else{
    runCoins.push({x:W+PW/2,y:coinY,r:10,c:'#FFD700',val:1,collected:false,glow:false});
  }
}

// ==================== PIPE DRAWING ====================
function drawPipe(p){
  const {x,topH,gap,color,rim}=p;
  // Top pipe body
  const tg=ctx.createLinearGradient(x-PW/2,0,x+PW/2,0);
  tg.addColorStop(0,'rgba(0,0,0,.3)');tg.addColorStop(.3,color);tg.addColorStop(.7,color);tg.addColorStop(1,'rgba(0,0,0,.3)');
  ctx.fillStyle=tg;ctx.fillRect(x-PW/2,0,PW,topH);
  // Top cap
  ctx.fillStyle=rim;ctx.fillRect(x-PW/2-PCAP,topH-22,PW+PCAP*2,22);
  ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1;
  ctx.strokeRect(x-PW/2-PCAP,topH-22,PW+PCAP*2,22);
  // Bottom pipe body
  const bY=topH+gap;const bH=H-GND-bY;
  ctx.fillStyle=tg;ctx.fillRect(x-PW/2,bY,PW,bH);
  // Bottom cap
  ctx.fillStyle=rim;ctx.fillRect(x-PW/2-PCAP,bY,PW+PCAP*2,22);
  ctx.strokeStyle='rgba(0,0,0,.22)';ctx.lineWidth=1;
  ctx.strokeRect(x-PW/2-PCAP,bY,PW+PCAP*2,22);
}

// ==================== COLLISION ====================
function checkPipeHit(){
  for(const p of pipes){
    const dx=Math.abs(bird.x-p.x);
    const hitTop=bird.y-BR<p.topH;
    const hitBot=bird.y+BR>p.topH+p.gap;
    if(dx<PW/2+BR-4&&(hitTop||hitBot)){
      handleHit();return;
    }
  }
  if(bird.y+BR>H-GND||bird.y-BR<0){
    handleHit();
  }
}
function handleHit(){
  if(runItems.shield.active&&!runItems.shield.used){
    runItems.shield.used=true;
    G.flash=0.4;G.flashC='#29B6F6';
    burst(bird.x,bird.y,'#29B6F6',16,140);
    if(bird.y-BR<0)bird.vy=Math.abs(bird.vy);
    return;
  }
  killBird();
}
function killBird(){
  if(!bird.alive)return;
  bird.alive=false;
  bird.vy=FLAP*.5;
  G.flash=0.5;G.flashC='#FF1744';
  G.shake=0.4;G.shakeM=10;
  burst(bird.x,bird.y,'#FF6E40',20,180);
  P.coins+=G.coins;
  if(G.score>P.highScore)P.highScore=G.score;
  savePlayer();
  submitScore(G.score,G.curLv);
  setTimeout(()=>{G.scene='gameOver';},900);
}

// ==================== TICK PLAY ====================
function tickPlay(dt,t){
  updateClouds(dt);
  updateMountains(dt);
  updateGround(dt);

  if(!bird.alive){
    bird.vy+=GRAV*dt;
    bird.y+=bird.vy*dt;
    bird.angle=clamp(bird.angle+dt*4,-.5,Math.PI/2);
    particles.forEach(p=>{p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt*1.5;});
    particles=particles.filter(p=>p.life>0);
    return;
  }
  const d=D(G.score);
  windT+=dt*1.2;
  const wind=d.wind?(Math.sin(windT)*60):0;

  bird.vy+=GRAV*dt;
  if(d.wind)bird.vy+=wind*dt*0.3;
  bird.y+=bird.vy*dt;
  bird.angle=clamp(bird.vy/600,-.5,Math.PI*.55);
  bird.wingAnim+=dt*8;
  bird.blinkT+=dt;
  if(bird.blinkT>3){bird.blinkOpen=false;}
  if(bird.blinkT>3.18){bird.blinkOpen=true;bird.blinkT=0;}

  // Trail
  if(P.activeEffect){
    spawnTrailParticle(bird.x+12,bird.y,P.activeEffect,t);
  }
  updateTrailParticles(dt);

  // Hourglass timer
  if(runItems.hourglass.active){
    runItems.hourglass.timer-=dt;
    if(runItems.hourglass.timer<=0){timeScale=1.0;runItems.hourglass.active=false;}
  }

  // Pipes
  spawnTimer-=dt;
  if(spawnTimer<=0){spawnPipe();spawnTimer=d.ivl/1000;}
  for(let i=pipes.length-1;i>=0;i--){
    const p=pipes[i];
    p.x-=d.spd*dt*timeScale;
    if(p.mv){
      p.topH+=p.mvDir*p.mvSpd*dt*timeScale;
      if(p.topH<60||p.topH>H-GND-d.gap-60)p.mvDir*=-1;
    }
    if(!p.passed&&p.x<bird.x){p.passed=true;G.score++;G.curLv=getLv(G.score);}
    if(p.x<-PW-PCAP)pipes.splice(i,1);
  }
  // Coins
  for(let i=runCoins.length-1;i>=0;i--){
    const c=runCoins[i];
    c.x-=d.spd*dt*timeScale;
    if(!c.collected&&d2(bird.x,bird.y,c.x,c.y)<(BR+c.r)**2){
      c.collected=true;
      G.coins+=c.val;
      burst(c.x,c.y,'#FFD700',8,80);
    }
    if(c.x<-20)runCoins.splice(i,1);
  }
  // Particles
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i];
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt;p.life-=dt*1.5;
    if(p.life<=0)particles.splice(i,1);
  }
  checkPipeHit();
}

// ==================== DRAW HELPERS ====================
function roundRect(x,y,w,h,r){
  ctx.beginPath();
  r=Math.min(r,w/2,h/2);
  ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);
  ctx.arcTo(x+w,y,x+w,y+r,r);ctx.lineTo(x+w,y+h-r);
  ctx.arcTo(x+w,y+h,x+w-r,y+h,r);ctx.lineTo(x+r,y+h);
  ctx.arcTo(x,y+h,x,y+h-r,r);ctx.lineTo(x,y+r);
  ctx.arcTo(x,y,x+r,y,r);ctx.closePath();
}
function shadeColor(col,amt){
  try{
    let hex=col.replace('#','');
    if(hex.length===3)hex=hex.split('').map(c=>c+c).join('');
    const num=parseInt(hex,16);
    const r=clamp(((num>>16)&0xff)+Math.round(amt*255),0,255);
    const g=clamp(((num>>8)&0xff)+Math.round(amt*255),0,255);
    const b=clamp((num&0xff)+Math.round(amt*255),0,255);
    return`#${((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1)}`;
  }catch(e){return col;}
}
function btn(cx,cy,w,h,label,bg,fg,fontSize,radius){
  fg=fg||'#fff';fontSize=fontSize||18;radius=radius||14;
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)';ctx.shadowBlur=10;
  let fillColor=bg;
  if(bg.startsWith('#')){
    const g2=ctx.createLinearGradient(cx-w/2,cy-h/2,cx-w/2,cy+h/2);
    g2.addColorStop(0,bg);g2.addColorStop(1,shadeColor(bg,-.18));
    fillColor=g2;
  }
  ctx.fillStyle=fillColor;
  roundRect(cx-w/2,cy-h/2,w,h,radius);ctx.fill();
  ctx.shadowBlur=0;
  ctx.strokeStyle='rgba(255,255,255,.15)';ctx.lineWidth=1;
  roundRect(cx-w/2,cy-h/2,w,h,radius);ctx.stroke();
  ctx.fillStyle=fg;ctx.font=`bold ${fontSize}px system-ui`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,cx,cy+1);
  ctx.restore();
}
function smallBtn(cx,cy,w,h,label,bg,fg){
  btn(cx,cy,w,h,label,bg,fg||'#fff',13,8);
}
function tabBtn(cx,cy,w,h,label,active){
  ctx.save();
  ctx.fillStyle=active?'rgba(255,255,255,.2)':'rgba(255,255,255,.07)';
  roundRect(cx-w/2,cy-h/2,w,h,10);ctx.fill();
  ctx.strokeStyle=active?'rgba(255,255,255,.5)':'rgba(255,255,255,.14)';ctx.lineWidth=1;
  roundRect(cx-w/2,cy-h/2,w,h,10);ctx.stroke();
  ctx.fillStyle=active?'#fff':'rgba(255,255,255,.5)';
  ctx.font=`${active?'bold ':' '}14px system-ui`;
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(label,cx,cy+1);
  ctx.restore();
}
function tx(text,x,y,color,size,align,weight){
  color=color||'#fff';size=size||18;align=align||'center';weight=weight||'normal';
  ctx.save();ctx.fillStyle=color;ctx.font=`${weight} ${size}px system-ui`;
  ctx.textAlign=align;ctx.textBaseline='middle';ctx.fillText(text,x,y);ctx.restore();
}
function gCard(x,y,w,h,r){
  r=r||16;
  const g=ctx.createLinearGradient(x,y,x,y+h);
  g.addColorStop(0,'rgba(255,255,255,.09)');g.addColorStop(1,'rgba(255,255,255,.04)');
  ctx.fillStyle=g;roundRect(x,y,w,h,r);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.11)';ctx.lineWidth=1;
  roundRect(x,y,w,h,r);ctx.stroke();
}

// ==================== SCENE BACKGROUNDS ====================
function drawSky(t){
  const sky=ctx.createLinearGradient(0,0,0,H-GND);
  sky.addColorStop(0,'#050818');
  sky.addColorStop(0.4,'#0d1b3e');
  sky.addColorStop(1,'#1a2a5e');
  ctx.fillStyle=sky;ctx.fillRect(0,0,W,H-GND);
  // Stars
  for(let i=0;i<44;i++){
    const sx=((i*137.508)%W);
    const sy=((i*73.31)%(H-GND-80));
    const ss=0.5+((i*0.29)%1.5);
    const blink=0.4+0.4*Math.sin(t*1.5+i*0.7);
    ctx.globalAlpha=blink;
    ctx.fillStyle='#fff';
    ctx.beginPath();ctx.arc(sx,sy,ss,0,Math.PI*2);ctx.fill();
  }
  ctx.globalAlpha=1;
}

// ==================== DRAW BIRD ====================
function drawBird(t){
  const wa=Math.sin(bird.wingAnim)*0.5;
  const bl=!bird.blinkOpen;
  ctx.save();
  ctx.translate(bird.x,bird.y);
  ctx.rotate(bird.angle);
  ctx.translate(-bird.x,-bird.y);

    ctx.beginPath();ctx.arc(bird.x,bird.y,BR+6,0,Math.PI*2);ctx.stroke();

}

// ==================== HUD ====================
function drawHUD(){

// ==================== FLASH ====================
function applyFlash(dt){
  if(G.flash>0){
    // Parse color to rgba
    let r=255,g=0,b=0;
    const hc=G.flashC.replace('#','');
    if(hc.length===6){
      r=parseInt(hc.slice(0,2),16);
      g=parseInt(hc.slice(2,4),16);
      b=parseInt(hc.slice(4,6),16);
    }
    ctx.fillStyle=`rgba(${r},${g},${b},${G.flash*.4})`;
    ctx.fillRect(0,0,W,H);
    G.flash=Math.max(0,G.flash-dt*3);
  }
}

// ==================== INPUT ====================
function hitTest(cx,cy,bx,by,bw,bh){
  return cx>=bx-bw/2&&cx<=bx+bw/2&&cy>=by-bh/2&&cy<=by+bh/2;
}
function setShopMsg(msg,color){shopMsg=msg;shopMsgT=Date.now();shopMsgColor=color||'#4CAF50';}

function tap(cx,cy){
  // ---- MENU ----
  if(G.scene==='menu'){
    if(hitTest(cx,cy,W/2,300,224,52)){G.scene='preBuy';equippedForRun=[];return;}
    if(hitTest(cx,cy,W/2,368,224,48)){G.scene='shop';shopTab=0;shopMsg='';return;}
    if(hitTest(cx,cy,W/2,428,200,44)){G.scene='skinSelect';return;}
    if(hitTest(cx,cy,W/2,482,180,40)){
      G.scene='leaderboard';lbLoading=true;lbData=[];
      fetchLeaderboard().then(d=>{lbData=d||[];lbLoading=false;});return;
    }
    // Tap anywhere else
    G.scene='preBuy';equippedForRun=[];return;
  }
  // ---- SKIN SELECT ----
  if(G.scene==='skinSelect'){
    if(hitTest(cx,cy,W/2,H-GND-26,180,42)){G.scene='menu';return;}
    const cols=2,cw=182,ch=140;
    const startX=(W-cols*cw)/2+cw/2,startY=78;
    SK.forEach((sk,i)=>{
      const col=i%cols,row=Math.floor(i/cols);
      const bx=startX+col*cw,by=startY+row*ch;
      const owned=P.ownedSkins.includes(i);
      if(sk.price>0&&!owned){
        if(hitTest(cx,cy,bx+44,by+60,112,28)){
          if(P.coins>=sk.price){P.coins-=sk.price;P.ownedSkins.push(i);G.skin=i;P.equippedSkin=i;savePlayer();}
        }
      }else if(owned&&G.skin!==i){
        if(hitTest(cx,cy,bx+44,by+55,104,28)){G.skin=i;P.equippedSkin=i;savePlayer();}
      }
    });
    return;
  }
  // ---- SHOP ----
  if(G.scene==='shop'){
    if(hitTest(cx,cy,W/2,H-GND-26,180,42)){G.scene='menu';return;}
    // Tab switching
    const tw=110;
    [0,1,2].forEach(i=>{
      if(hitTest(cx,cy,W/2+(i-1)*tw,90,tw-4,32))shopTab=i;
    });
    const cardW=(W-40)/2,cardH=148,startX=16,startY=118;
    if(shopTab===0){
      ITEMS.forEach((item,i)=>{
        if(!item.available)return;
        const col=i%2,row=Math.floor(i/2);
        const bx=startX+col*(cardW+8)+cardW/2,by=startY+row*(cardH+8)+114;
        if(hitTest(cx,cy,bx,by,cardW-18,26)){
          if(P.coins>=item.price){P.coins-=item.price;P.inventory[item.id]=(P.inventory[item.id]||0)+1;savePlayer();setShopMsg('购买成功！','#4CAF50');}
          else setShopMsg('余额不足','#FF5252');
        }
      });
    }else if(shopTab===1){
      EFFECTS.forEach((ef,i)=>{
        const col=i%2,row=Math.floor(i/2);
        const bx=startX+col*(cardW+8)+cardW/2,by=startY+row*(cardH+8)+102;
        if(hitTest(cx,cy,bx,by,cardW-18,26)){
          const owned=P.ownedEffects.includes(ef.id);
          const active=P.activeEffect===ef.id;
          if(active)return;
          if(owned){P.activeEffect=ef.id;savePlayer();setShopMsg('已装备！','#4CAF50');}
          else if(P.coins>=ef.price){P.coins-=ef.price;P.ownedEffects.push(ef.id);P.activeEffect=ef.id;savePlayer();setShopMsg('购买成功！','#4CAF50');}
          else setShopMsg('余额不足','#FF5252');
        }
      });
      if(P.activeEffect){
        const btnY=startY+2*(cardH+8)+18;
        if(hitTest(cx,cy,W/2,btnY,170,28)){P.activeEffect=null;savePlayer();setShopMsg('已取消特效','#90A4AE');}
      }
    }else{
      SK.forEach((sk,i)=>{
        const col=i%2,row=Math.floor(i/2);
        const cbx=startX+col*(cardW+8)+cardW/2+8,cby=startY+row*(cardH+8);
        const owned=P.ownedSkins.includes(i);
        const active=G.skin===i;
        if(sk.price>0&&!owned){
          if(hitTest(cx,cy,cbx,cby+92,cardW-28,26)){
            if(P.coins>=sk.price){P.coins-=sk.price;P.ownedSkins.push(i);G.skin=i;P.equippedSkin=i;savePlayer();setShopMsg('购买成功！','#4CAF50');}
            else setShopMsg('余额不足','#FF5252');
          }
        }else if(owned&&!active){
          if(hitTest(cx,cy,cbx,cby+80,cardW-28,24)){G.skin=i;P.equippedSkin=i;savePlayer();setShopMsg('已装备！','#4CAF50');}
        }
      });
    }
    return;
  }
  // ---- PRE-BUY ----
  if(G.scene==='preBuy'){
    if(hitTest(cx,cy,W/2,H-GND-22,120,30)){G.scene='menu';return;}
    if(hitTest(cx,cy,W/2,H-GND-66,240,52)){startGame();return;}
    const avail=ITEMS.filter(it=>it.available);
    avail.forEach((item,i)=>{
      const icy=94+i*120;
      if(hitTest(cx,cy,W/2+54,icy+90,108,30)){
        const cnt=P.inventory[item.id]||0;
        if(cnt<=0)return;
        const idx=equippedForRun.indexOf(item.id);
        if(idx>=0)equippedForRun.splice(idx,1);
        else equippedForRun.push(item.id);
      }
      if(hitTest(cx,cy,W/2+116,icy+24,58,24)){G.scene='shop';shopTab=0;shopMsg='';}
    });
    return;
  }
  // ---- READY ----
  if(G.scene==='ready'){
    bird.vy=FLAP;G.scene='playing';return;
  }
  // ---- PLAYING ----
  if(G.scene==='playing'){
    if(!bird.alive)return;
    // Check hourglass button FIRST
    if(runItems.hourglass.equipped){
      const hx=W-32,hy=H-GND-52;
      if(d2(cx,cy,hx,hy)<900){// 30^2=900
        if(!runItems.hourglass.active){
          runItems.hourglass.active=true;
          runItems.hourglass.timer=15;
          timeScale=0.6;
        }
        return; // do NOT flap
      }
    }
    bird.vy=FLAP;
    return;
  }
  // ---- GAME OVER ----
  if(G.scene==='gameOver'){
    if(hitTest(cx,cy,W/2,372,224,50)){G.scene='preBuy';equippedForRun=[];return;}
    if(hitTest(cx,cy,W/2,432,200,44)){G.scene='shop';shopTab=0;shopMsg='';return;}
    if(hitTest(cx,cy,W/2,482,180,40)){
      G.scene='leaderboard';lbLoading=true;lbData=[];
      fetchLeaderboard().then(d=>{lbData=d||[];lbLoading=false;});return;
    }
    return;
  }
  // ---- LEADERBOARD ----
  if(G.scene==='leaderboard'){
    if(hitTest(cx,cy,W/2,H-GND-26,180,42)){G.scene='menu';return;}
    return;
  }
}

// ==================== START GAME ====================
function startGame(){
  G.score=0;G.coins=0;G.curLv=1;G.flash=0;G.shake=0;G.shakeM=0;
  G.skin=P.equippedSkin||0;
  initWorld();resetBird();
  spawnTimer=D(0).ivl/1000;
  // Apply equipped items for this run
  runItems={shield:{active:false,used:false},hourglass:{active:false,timer:0,equipped:false}};
  equippedForRun.forEach(id=>{
    if(id==='shield'){
      const cnt=P.inventory.shield||0;
      if(cnt>0){runItems.shield.active=true;P.inventory.shield=cnt-1;savePlayer();}
    }
    if(id==='hourglass'){
      const cnt=P.inventory.hourglass||0;
      if(cnt>0){runItems.hourglass.equipped=true;P.inventory.hourglass=cnt-1;savePlayer();}
    }
  });
  timeScale=1.0;
  G.scene='ready';
}

// ==================== MAIN LOOP ====================
function frame(ts){
  const dt=Math.min((ts-lastT)/1000,0.05);
  lastT=ts;
  const t=ts/1000;
  ctx.clearRect(0,0,W,H);

  // Screen shake
  let shaking=G.shake>0;
  if(shaking){
    const sx=R(-G.shakeM,G.shakeM)*G.shake;
    const sy=R(-G.shakeM,G.shakeM)*G.shake;
    ctx.save();ctx.translate(sx,sy);
    G.shake=Math.max(0,G.shake-dt*4);
  }

  switch(G.scene){
    case'menu':drawMenu(t);break;
    case'skinSelect':drawSkinSelect(t);break;
    case'shop':drawShop(t);break;
    case'preBuy':drawPreBuy(t);break;
    case'ready':drawReady(t);break;
    case'playing':tickPlay(dt,t);drawPlaying(t);break;
    case'gameOver':drawGameOver(t);break;
    case'leaderboard':drawLeaderboard(t);break;
    default:drawMenu(t);
  }

  if(shaking)ctx.restore();
  applyFlash(dt);

  requestAnimationFrame(frame);
}

// ==================== EVENT LISTENERS ====================
cv.addEventListener('pointerdown',e=>{
  e.preventDefault();
  const rect=cv.getBoundingClientRect();
  const scaleX=W/rect.width,scaleY=H/rect.height;
  const x=(e.clientX-rect.left)*scaleX;
  const y=(e.clientY-rect.top)*scaleY;
  tap(x,y);
},{passive:false});

document.addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='ArrowUp'){
    e.preventDefault();
    if(G.scene==='playing'&&bird.alive)bird.vy=FLAP;
    else if(G.scene==='ready'){bird.vy=FLAP;G.scene='playing';}
    else if(G.scene==='menu'){G.scene='preBuy';equippedForRun=[];}
    else if(G.scene==='gameOver'){G.scene='preBuy';equippedForRun=[];}
  }
});

// ==================== INIT ====================
loadPlayer();
G.skin=P.equippedSkin||0;
initWorld();
resetBird();
lastT=performance.now();
requestAnimationFrame(frame);
</script>
